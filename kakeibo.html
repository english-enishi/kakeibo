<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#4F46E5">
  <title>Kakeibo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-light: #EEF2FF;
      --bg: #F1F5F9;
      --surface: #FFFFFF;
      --border: #E2E8F0;
      --text: #1E293B;
      --text-muted: #64748B;
      --nav-height: 64px;
      --header-height: 60px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }
    #app { padding-bottom: calc(var(--nav-height) + 8px); }

    /* ── Header ── */
    .header {
      background: var(--primary);
      color: white;
      padding: 14px 20px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      min-height: var(--header-height);
    }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header .subtitle { font-size: 12px; opacity: 0.8; margin-top: 3px; }

    /* ── Bottom Nav ── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: var(--nav-height);
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      z-index: 100;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--text-muted);
      font-size: 11px;
      transition: color 0.15s;
      padding: 0;
    }
    .nav-item.active { color: var(--primary); }
    .nav-item .icon { font-size: 22px; line-height: 1; }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border-radius: 14px;
      padding: 16px;
      margin: 12px 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .card-title {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    /* ── Forms ── */
    .form-group { margin-bottom: 14px; }
    .form-group:last-child { margin-bottom: 0; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    input[type="text"], input[type="number"], input[type="date"], select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      color: var(--text);
      background: var(--surface);
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    input:focus, select:focus { border-color: var(--primary); }
    .amount-input {
      font-size: 36px;
      font-weight: 700;
      text-align: center;
      letter-spacing: -1px;
      padding: 14px;
      border: 2px solid var(--border);
    }
    .amount-input:focus { border-color: var(--primary); }

    /* ── Category Grid ── */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .category-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px 4px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      background: var(--surface);
      transition: all 0.15s;
      font-size: 11px;
      color: var(--text-muted);
      font-family: inherit;
    }
    .category-btn:active { transform: scale(0.96); }
    .category-btn.selected {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
    }
    .category-btn .emoji { font-size: 22px; line-height: 1.2; }

    /* ── Payment Method ── */
    .pay-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    /* ── Buttons ── */
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      font-family: inherit;
      letter-spacing: 0.2px;
    }
    .btn:active { opacity: 0.85; transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: var(--bg); color: var(--text); border: 1.5px solid var(--border); }
    .btn-danger { background: #FEF2F2; color: #EF4444; border: 1.5px solid #FECACA; }

    /* ── Progress Bar ── */
    .progress-bar {
      height: 7px;
      background: var(--bg);
      border-radius: 100px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-fill {
      height: 100%;
      border-radius: 100px;
      transition: width 0.5s ease;
    }

    /* ── Transaction List ── */
    .tx-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--bg);
      cursor: pointer;
    }
    .tx-item:last-child { border-bottom: none; }
    .tx-item:active { opacity: 0.7; }
    .tx-emoji {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .tx-info { flex: 1; min-width: 0; }
    .tx-name {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tx-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .tx-amount {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      flex-shrink: 0;
    }
    .tx-date-header {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      padding: 10px 14px 4px;
      display: flex;
      justify-content: space-between;
    }

    /* ── Month Selector ── */
    .month-selector {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 2px;
    }
    .month-btn {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      padding: 4px 10px;
      color: var(--text-muted);
      font-family: inherit;
      border-radius: 8px;
      transition: background 0.15s;
    }
    .month-btn:active { background: var(--border); }
    .month-label { font-size: 16px; font-weight: 700; color: var(--text); }

    /* ── Import Zone ── */
    .import-zone {
      border: 2px dashed var(--border);
      border-radius: 14px;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      user-select: none;
    }
    .import-zone:hover, .import-zone:active { border-color: var(--primary); background: var(--primary-light); }
    .import-icon { font-size: 36px; margin-bottom: 8px; }

    /* ── Badge ── */
    .badge {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 100px;
      font-size: 10px;
      font-weight: 600;
    }
    .badge-import { background: #E0F2FE; color: #0369A1; }

    /* ── Big Summary ── */
    .big-amount {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1.1;
    }
    .amount-label { font-size: 11px; color: var(--text-muted); font-weight: 500; margin-top: 2px; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: calc(var(--nav-height) + 16px);
      left: 50%;
      transform: translateX(-50%);
      background: #1E293B;
      color: white;
      padding: 11px 22px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 500;
      z-index: 500;
      animation: toastIn 0.25s ease;
      white-space: nowrap;
      pointer-events: none;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(8px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ── Empty State ── */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
    }
    .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; line-height: 1.5; }

    /* ── Scroll container ── */
    .scroll-list {
      max-height: 320px;
      overflow-y: auto;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .scroll-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--bg);
      font-size: 13px;
    }
    .scroll-item:last-child { border-bottom: none; }

    /* ── Settings row ── */
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--bg);
      cursor: pointer;
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-row-label { font-size: 15px; font-weight: 500; }
    .settings-row-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* ── Chip ── */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
      background: var(--bg);
      color: var(--text-muted);
      border: 1.5px solid var(--border);
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip.active {
      background: var(--primary-light);
      color: var(--primary);
      border-color: var(--primary);
    }
    .tab-btn {
      padding: 10px 0;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      background: var(--bg);
      color: var(--text-muted);
      border: 1.5px solid var(--border);
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn.active {
      background: var(--primary-light);
      color: var(--primary);
      border-color: var(--primary);
    }
  </style>
</head>
<body>
<div id="app"></div>

<script>
// ════════════════════════════════════════════════════════════
// CONSTANTS & CATEGORIES
// ════════════════════════════════════════════════════════════

const CATEGORIES = {
  food:          { name: 'Groceries',    emoji: '🛒', color: '#22C55E' },
  convenience:   { name: 'Konbini',      emoji: '🏪', color: '#059669' },
  dining:        { name: 'Dining (General)', emoji: '🍜', color: '#F97316' },
  lunch:         { name: 'Lunch Out',    emoji: '🥗', color: '#FB923C' },
  dinner:        { name: 'Dinner Out',   emoji: '🍷', color: '#EA580C' },
  cafe:          { name: 'Cafe',         emoji: '☕', color: '#92400E' },
  transport:     { name: 'Transport',    emoji: '🚃', color: '#3B82F6' },
  entertainment: { name: 'Fun',          emoji: '🎮', color: '#A855F7' },
  movies:        { name: 'Movies',       emoji: '🎬', color: '#7C3AED' },
  daily:         { name: 'Daily Items',  emoji: '🧴', color: '#14B8A6' },
  shopping:      { name: 'Shopping',     emoji: '🛍️', color: '#EC4899' },
  clothes:       { name: 'Clothes',      emoji: '👗', color: '#DB2777' },
  utilities:     { name: 'Utilities',    emoji: '💡', color: '#EAB308' },
  health:        { name: 'Health',       emoji: '🏥', color: '#EF4444' },
  vacation:      { name: 'Vacation',     emoji: '✈️', color: '#0EA5E9' },
  savings:       { name: 'Savings',      emoji: '💰', color: '#6366F1' },
  other:         { name: 'Other',        emoji: '📦', color: '#64748B' },
};

const PAYMENT_METHODS = {
  credit: { name: 'Credit Card',   icon: '💳' },
  cash:   { name: 'Cash',          icon: '💴' },
  bank:   { name: 'Bank Transfer', icon: '🏦' },
  emoney: { name: 'PayPay',        icon: '📱' },
};

const INCOME_CATEGORIES = {
  salary:  { name: 'Salary',   emoji: '💼', color: '#22C55E' },
  bonus:   { name: 'Bonus',    emoji: '🎁', color: '#6366F1' },
  other:   { name: 'Other',    emoji: '💹', color: '#14B8A6' },
};

// Auto-categorization rules
// Note: SMBC CSV uses old JIS katakana: ファ→フア, ジャ→ジヤ, ッ→ツ, ュ→ユ, ー→− etc.
// We normalize − to ー before matching, but other substitutions need explicit patterns.
const AUTO_RULES = [
  // Convenience stores
  { re: /ローソン|セブンイレブン|ファミリーマート|フアミリーマート|フアミリ|デイリーヤマザキ|ニューデイズ|ニユーデイ|ミニストップ|ポプラ|コンビニ|ポヴォ/, cat: 'convenience' },
  // Supermarkets
  { re: /イトーヨーカドー|マイバスケット|マイバスケツ|スーパー|ライフ|西友|イオン|マックスバリュ|業務スーパー/, cat: 'food' },
  // Vending machines
  { re: /ジヤパンビバレツジ|ジャパンビバレッジ|ビバレツジ|ビバレッジ|自動販売/, cat: 'convenience' },
  // Cafes
  { re: /カフェ|カフエ|スターバックス|タリーズ|ドトール|コーヒー|コーヒ|カルディ|デイルコヒ|ダイルコヒ|スタバ|パドラーズ/, cat: 'cafe' },
  // Dining / restaurants
  { re: /吉野家|ヨシノヤ|マクドナルド|ピザ|ラーメン|レストラン|バーガー|カツヤ|ビストロ|居酒屋|焼肉|カルビ|ヤキニク|天ぷら|とんかつ|蕎麦|うどん|タンドール|サンダイメ|チビトー|ルコ/, cat: 'dining' },
  // Movies
  { re: /映画|シネマ|東宝|シネマズ|映画館|トウホウ/, cat: 'movies' },
  // Transport
  { re: /スイカ|モバイルスイカ|モバイルスイ|交通|バス|タクシー|電車|地下鉄|PASMO|パスモ/, cat: 'transport' },
  // Amazon
  { re: /ＡＭＡＺＯＮ|Amazon|アマゾン/, cat: 'shopping' },
  // Streaming / subscriptions
  { re: /ネツトフリツクス|ネットフリックス|NETFLIX|Netflix|スポティファイ|Ｓｐｏｔｉｆｙ|Spotify|アップル|Applemusic|YouTube/, cat: 'entertainment' },
  // Utilities
  { re: /ガス|電気|水道|NHK|光熱|電力|東京ガス|トウキヨウガス|東電|ポポ/, cat: 'utilities' },
  // Health
  { re: /病院|薬|クリニック|医院|調剤|ドラッグ|マツキヨ|ウエルシア|ツルハ|スギ薬局|サンドラッグ/, cat: 'health' },
  // Clothes
  { re: /ユニクロ|GU|ジーユー|アパレル|ファッション|洋服|衣料|ルミネ|マルイ|キタセンジユ|ネオリーブ|ルカ/, cat: 'clothes' },
  // Shopping (general)
  { re: /プラザ|ニトリ|無印|コスメ|デパート|ショッピング/, cat: 'shopping' },
];

function normalizeJP(str) {
  // SMBC CSV uses fullwidth dashes instead of katakana prolonged sound mark (ー)
  return str
    .replace(/[－−‐—―]/g, 'ー')
    .replace(/\s+/g, ' ')
    .trim();
}

function autoCategory(merchant) {
  const norm = normalizeJP(merchant);
  for (const rule of AUTO_RULES) {
    if (rule.re.test(norm) || rule.re.test(merchant)) return rule.cat;
  }
  return 'other';
}

// ════════════════════════════════════════════════════════════
// STORAGE
// ════════════════════════════════════════════════════════════

function loadData() {
  try { return JSON.parse(localStorage.getItem('kakeibo_v1') || '{}'); }
  catch { return {}; }
}

function saveData(data) {
  localStorage.setItem('kakeibo_v1', JSON.stringify(data));
}

const ACCOUNT_TYPE_LABEL = {
  bank: 'Bank Account', emoney: 'e-Money', cash: 'Cash', investment: 'Investment',
};

const DEFAULT_ACCOUNTS = {
  smbc:   { name: 'SMBC',       type: 'bank',       icon: '🏦', balance: 0 },
  yucho:  { name: 'ゆうちょ銀行', type: 'bank',       icon: '🏦', balance: 0 },
  paypay: { name: 'PayPay',     type: 'emoney',     icon: '📱', balance: 0 },
  cash:   { name: 'Cash',       type: 'cash',       icon: '💴', balance: 0 },
  sbi:    { name: 'SBI証券',    type: 'investment', icon: '📈', balance: 0 },
};

function getState() {
  const d = loadData();
  return {
    transactions: d.transactions || [],
    subscriptions: d.subscriptions || [],
    accounts: { ...DEFAULT_ACCOUNTS, ...(d.accounts || {}) },
    transfers: d.transfers || [],
    settlements: d.settlements || [],
    budgets: d.budgets || {
      food: 30000, convenience: 10000, dining: 20000, cafe: 8000,
      transport: 15000, entertainment: 5000, movies: 3000,
      daily: 10000, shopping: 10000, clothes: 10000,
      utilities: 10000, health: 5000, vacation: 0,
      savings: 30000, other: 5000,
    },
    monthlyBudget: d.monthlyBudget || 150000,
  };
}

function setState(updates) {
  const current = loadData();
  saveData({ ...current, ...updates });
}

// Which account a transaction directly affects (PayPay / cash / debit only — not credit)
function txAccountKey(tx) {
  if (!tx) return null;
  if (tx.txType === 'income') return tx.incomeAccount || null;
  if (tx.paymentMethod === 'paypay') return 'paypay';
  if (tx.paymentMethod === 'emoney') return 'paypay';
  if (tx.paymentMethod === 'cash')   return 'cash';
  if (tx.paymentMethod === 'bank')   return tx.bankAccount || null;
  if (tx.paymentMethod === 'debit')  return tx.debitAccount || null;
  return null;
}

// Apply a transaction's effect to the relevant account balance (sign: +1 add, -1 reverse)
function applyTxToAccounts(tx, sign) {
  const key = txAccountKey(tx);
  if (!key) return;
  const state = getState();
  if (!state.accounts[key]) return;
  const delta = (tx.txType === 'income' ? tx.amount : -tx.amount) * sign;
  state.accounts[key].balance += delta;
  setState({ accounts: state.accounts });
}

// After CSV import, settle the billing cycle total against ゆうちょ銀行 (debited on the 27th)
function reconcileCreditSettlement(billingYm) {
  const state = getState();
  const yuchoKey = 'yucho';
  if (!state.accounts[yuchoKey]) return { total: 0 };
  const total = state.transactions
    .filter(t => t.paymentMethod === 'credit' && t.txType !== 'income' && billingMonthOf(t.date) === billingYm)
    .reduce((s, t) => s + t.amount, 0);
  const settlements = [...(state.settlements || [])];
  const idx = settlements.findIndex(s => s.ym === billingYm);
  if (idx >= 0) {
    const delta = total - settlements[idx].amount;
    if (delta !== 0) { state.accounts[yuchoKey].balance -= delta; settlements[idx] = { ...settlements[idx], amount: total }; }
  } else if (total > 0) {
    state.accounts[yuchoKey].balance -= total;
    settlements.push({ id: uuid(), ym: billingYm, date: `${billingYm}-27`, amount: total });
  }
  setState({ accounts: state.accounts, settlements });
  return { total };
}

// ════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════

function uuid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function fmtYen(n) {
  return '¥' + Math.round(Math.abs(n)).toLocaleString('en-US');
}

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function fmtDate(d) {
  const dt = new Date(d + 'T00:00:00');
  return `${MONTHS[dt.getMonth()]} ${dt.getDate()}`;
}

function fmtDateFull(d) {
  const dt = new Date(d + 'T00:00:00');
  return `${MONTHS_FULL[dt.getMonth()]} ${dt.getDate()}, ${dt.getFullYear()}`;
}

function todayStr() { return new Date().toISOString().slice(0, 10); }
function currentMonthStr() { return billingMonthOf(todayStr()); }

function monthLabel(ym) {
  const [y, m] = ym.split('-');
  return `${MONTHS_FULL[parseInt(m) - 1]} ${y}`;
}

function prevMonth(ym) {
  const [y, m] = ym.split('-').map(Number);
  return m === 1 ? `${y-1}-12` : `${y}-${String(m-1).padStart(2,'0')}`;
}

function nextMonth(ym) {
  const [y, m] = ym.split('-').map(Number);
  return m === 12 ? `${y+1}-01` : `${y}-${String(m+1).padStart(2,'0')}`;
}

// Billing cycle: 28th of the PREVIOUS month through 27th of THIS month.
// e.g. "2026-05" covers Apr 28 – May 27 (matching the SMBC statement).
function billingMonthOf(dateStr) {
  if (!dateStr) return '';
  const [y, m, d] = dateStr.split('-').map(Number);
  if (d >= 28) {
    // belongs to the next month's billing cycle
    const nm = m === 12 ? 1 : m + 1;
    const ny = m === 12 ? y + 1 : y;
    return `${ny}-${String(nm).padStart(2, '0')}`;
  }
  return `${y}-${String(m).padStart(2, '0')}`;
}

function getMonthTxs(transactions, ym) {
  return transactions.filter(t => billingMonthOf(t.date) === ym);
}

// Human-readable billing cycle range for a given YM, e.g. "May 28 – Jun 27"
function billingCycleLabel(ym) {
  const [y, m] = ym.split('-').map(Number);
  const pm = m === 1 ? 12 : m - 1;
  const py = m === 1 ? y - 1 : y;
  return `${MONTHS[pm - 1]} 28 – ${MONTHS[m - 1]} 27`;
}

function spentByCategory(transactions) {
  const result = {};
  for (const k of Object.keys(CATEGORIES)) result[k] = 0;
  for (const t of transactions) {
    if (t.txType === 'income') continue;
    if (t.reimbursable) continue; // exclude work reimbursables from personal spending
    const k = t.category in result ? t.category : 'other';
    result[k] += t.amount;
  }
  return result;
}

function incomeByCategory(transactions) {
  const result = {};
  for (const k of Object.keys(INCOME_CATEGORIES)) result[k] = 0;
  for (const t of transactions) {
    if (t.txType !== 'income') continue;
    const k = t.incomeCategory in result ? t.incomeCategory : 'other';
    result[k] += t.amount;
  }
  return result;
}

let _toastTimer = null;
function showToast(msg) {
  document.querySelectorAll('.toast').forEach(e => e.remove());
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.remove(), 2600);
}

const App = {
  view: 'dashboard',
  currentMonth: currentMonthStr(),
  editingTx: null,
  filterCategory: null,

  go(view, opts = {}) {
    if (opts.resetEdit !== false) this.editingTx = null;
    // Clean up chart instance when leaving Charts view
    if (this.view === 'charts' && view !== 'charts') {
      if (_activeChart)  { _activeChart.destroy();  _activeChart  = null; }
      if (_savingsChart) { _savingsChart.destroy(); _savingsChart = null; }
      if (_assetsChart)  { _assetsChart.destroy();  _assetsChart  = null; }
    }
    this.view = view;
    if (opts.month) this.currentMonth = opts.month;
    this.render();
  },

  render() {
    const root = document.getElementById('app');
    root.innerHTML = '';
    const views = {
      dashboard:     renderDashboard,
      add:           renderAdd,
      history:       renderHistory,
      annual:        renderAnnual,
      accounts:      renderAccounts,
      'account-edit':renderAccountEdit,
      charts:        renderCharts,
      budget:        renderBudget,
      settings:      renderSettings,
      import:        renderImport,
    };
    if (views[this.view]) root.appendChild(views[this.view]());
    root.appendChild(renderNav());
  },
};

function renderNav() {
  const nav = document.createElement('nav');
  nav.className = 'bottom-nav';
  const items = [
    { id: 'dashboard', icon: '🏠', label: 'Home' },
    { id: 'add',       icon: '➕', label: 'Add' },
    { id: 'history',   icon: '📋', label: 'History' },
    { id: 'accounts',  icon: '🏦', label: 'Assets' },
    { id: 'charts',    icon: '📈', label: 'Charts' },
    { id: 'budget',    icon: '📊', label: 'Budget' },
    { id: 'settings',  icon: '⚙️', label: 'Settings' },
  ];
  for (const item of items) {
    const btn = document.createElement('button');
    btn.className = 'nav-item' + (App.view === item.id ? ' active' : '');
    btn.innerHTML = `<span class="icon">${item.icon}</span><span>${item.label}</span>`;

}

// ════════════════════════════════════════════════════════════
// DASHBOARD
// ════════════════════════════════════════════════════════════

function renderDashboard() {
  const { transactions, budgets, monthlyBudget } = getState();
  const ym = App.currentMonth;
  const monthTxs = getMonthTxs(transactions, ym);
  const bycat = spentByCategory(monthTxs);
  const totalSpent = Object.values(bycat).reduce((a, b) => a + b, 0);
  const totalIncome = monthTxs.filter(t => t.txType === 'income').reduce((s, t) => s + t.amount, 0);
  const net = totalIncome - totalSpent;
  const remaining = monthlyBudget - totalSpent;
  const usedPct = monthlyBudget > 0 ? Math.min(100, Math.round((totalSpent / monthlyBudget) * 100)) : 0;
  const barColor = usedPct > 90 ? '#EF4444' : usedPct > 70 ? '#F97316' : '#22C55E';

  const div = document.createElement('div');

  // Header
  const header = document.createElement('div');
  header.className = 'header';
  header.innerHTML = `<h1>Kakeibo</h1><div class="subtitle">${monthLabel(ym)} &nbsp;·&nbsp; ${billingCycleLabel(ym)}</div>`;
  div.appendChild(header);

  // Month selector
  const ms = document.createElement('div');
  ms.className = 'month-selector';
  ms.innerHTML = `
    <button class="month-btn" id="prev-m">‹</button>
    <span class="month-label">${monthLabel(ym)}</span>
    <button class="month-btn" id="next-m">›</button>
  `;
  div.appendChild(ms);

  // Summary card
  const sumCard = document.createElement('div');
  sumCard.className = 'card';
  sumCard.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
      <div style="background:#22C55E12;border-radius:8px;padding:10px">
        <div class="amount-label">Income</div>
        <div style="font-size:20px;font-weight:800;color:#15803D;margin-top:2px">${fmtYen(totalIncome)}</div>
      </div>
      <div style="background:#4F46E512;border-radius:8px;padding:10px">
        <div class="amount-label">Spending</div>
        <div style="font-size:20px;font-weight:800;color:#4F46E5;margin-top:2px">${fmtYen(totalSpent)}</div>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div>
        <div class="amount-label">Net this month</div>
        <div style="font-size:16px;font-weight:700;color:${net >= 0 ? '#22C55E' : '#EF4444'}">${net >= 0 ? '+' : ''}${fmtYen(net)}</div>
      </div>
      <div style="text-align:right">
        <div class="amount-label">Budget remaining</div>
        <div style="font-size:16px;font-weight:700;color:${remaining >= 0 ? '#22C55E' : '#EF4444'}">${remaining >= 0 ? fmtYen(remaining) : '-' + fmtYen(-remaining)}</div>
        <div class="amount-label">${usedPct}% used</div>
      </div>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" style="width:${usedPct}%;background:${barColor}"></div>
    </div>
  `;
  div.appendChild(sumCard);

  // Receivables card (only when there are unsettled group pay transactions)
  const allGpTxs = transactions.filter(t => t.groupPay);
  const unsettledGp = allGpTxs.filter(t => {
    const collected = (t.splitCollections || []).reduce((s, c) => s + c.amount, 0);
    return (t.amount - (t.splitShare || 0) - collected) > 0;
  });
  if (unsettledGp.length > 0) {
    const totalOutstanding = unsettledGp.reduce((s, t) => {
      const collected = (t.splitCollections || []).reduce((sc, c) => sc + c.amount, 0);
      return s + Math.max(0, t.amount - (t.splitShare || 0) - collected);
    }, 0);
    const recCard = document.createElement('div');
    recCard.className = 'card';
    recCard.style.cssText = 'border-left:3px solid #15803D';
    recCard.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div>
          <div style="font-size:12px;font-weight:600;color:#15803D;margin-bottom:2px">💰 Receivables</div>
          <div style="font-size:11px;color:var(--text-muted)">${unsettledGp.length} group bill${unsettledGp.length>1?'s':''} outstanding</div>
        </div>
        <div style="font-size:20px;font-weight:800;color:#15803D">¥${totalOutstanding.toLocaleString()}</div>
      </div>
      <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px">
        ${unsettledGp.slice(0,3).map(t => {
          const col = (t.splitCollections || []).reduce((s, c) => s + c.amount, 0);
          const owed = t.amount - (t.splitShare || 0) - col;
          return `<div style="display:flex;align-items:center;justify-content:space-between;font-size:12px">
            <span style="color:var(--text-muted)">${fmtDate(t.date)} · ${t.description || '—'}</span>
            <span style="font-weight:600;color:#15803D">+¥${owed.toLocaleString()}</span>
          </div>`;
        }).join('')}
        ${unsettledGp.length > 3 ? `<div style="font-size:11px;color:var(--text-muted)">+${unsettledGp.length-3} more…</div>` : ''}
      </div>
    `;
    div.appendChild(recCard);
  }

  // Reimbursables card (only when there are outstanding work expenses)
  const pendingReimb = transactions.filter(t => t.reimbursable && !t.reimbursedAt);
  if (pendingReimb.length > 0) {
    const pendingTotal = pendingReimb.reduce((s, t) => s + t.amount, 0);
    const rCard = document.createElement('div');
    rCard.className = 'card';
    rCard.style.cssText = 'border-left:3px solid #7C3AED';
    rCard.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div>
          <div style="font-size:12px;font-weight:600;color:#7C3AED;margin-bottom:2px">💼 Work Reimbursables</div>
          <div style="font-size:11px;color:var(--text-muted)">${pendingReimb.length} expense${pendingReimb.length>1?'s':''} pending reimbursement</div>
        </div>
        <div style="font-size:20px;font-weight:800;color:#7C3AED">${fmtYen(pendingTotal)}</div>
      </div>
      <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px">
        ${pendingReimb.slice(0,3).map(t => `
          <div style="display:flex;align-items:center;justify-content:space-between;font-size:12px">
            <span style="color:var(--text-muted)">${fmtDate(t.date)} · ${t.description || '—'}</span>
            <span style="font-weight:600;color:#7C3AED">${fmtYen(t.amount)}</span>
          </div>`).join('')}
        ${pendingReimb.length > 3 ? `<div style="font-size:11px;color:var(--text-muted)">+${pendingReimb.length-3} more…</div>` : ''}
      </div>
    `;
    div.appendChild(rCard);
  }

  // Category breakdown
  const catCard = document.createElement('div');
  catCard.className = 'card';
  catCard.innerHTML = `<div class="card-title">By Category</div>`;

  const activeCats = Object.entries(CATEGORIES).filter(([k]) => bycat[k] > 0 || budgets[k] > 0);
  if (activeCats.length === 0) {
    catCard.innerHTML += `<div style="color:var(--text-muted);font-size:14px;text-align:center;padding:12px 0">Add your first transaction</div>`;
  } else {
    for (const [key, cat] of activeCats) {
      const spent = bycat[key] || 0;
      const bud = budgets[key] || 0;
      if (spent === 0 && bud === 0) continue;
      const pct = bud > 0 ? Math.min(100, Math.round((spent / bud) * 100)) : 0;
      const fillColor = pct > 90 ? '#EF4444' : pct > 70 ? '#F97316' : cat.color;
      const row = document.createElement('div');
      row.style.marginBottom = '12px';
      row.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <div style="display:flex;align-items:center;gap:7px">
            <span style="font-size:18px">${cat.emoji}</span>
            <span style="font-size:13px;font-weight:500">${cat.name}</span>
          </div>
          <div style="font-size:13px;text-align:right">
            <span style="font-weight:700">${fmtYen(spent)}</span>
            ${bud > 0 ? `<span style="color:var(--text-muted);font-size:11px"> / ${fmtYen(bud)}</span>` : ''}
          </div>
        </div>
        ${bud > 0 ? `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${fillColor}"></div></div>` : ''}
      `;
      catCard.appendChild(row);
    }
  }
  div.appendChild(catCard);

  // Recent transactions
  const recent = [...monthTxs].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5);
  if (recent.length > 0) {
    const txCard = document.createElement('div');
    txCard.className = 'card';
    const txHeader = document.createElement('div');
    txHeader.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px';
    txHeader.innerHTML = `
      <div class="card-title" style="margin-bottom:0">Recent Transactions</div>
      <span style="font-size:12px;color:var(--primary);cursor:pointer;font-weight:600" id="see-all">See all →</span>
    `;
    txCard.appendChild(txHeader);
    for (const tx of recent) txCard.appendChild(makeTxItem(tx));
    div.appendChild(txCard);
  }

  // Wire up
  setTimeout(() => {
    div.querySelector('#prev-m').onclick = () => App.go('dashboard', { month: prevMonth(App.currentMonth), resetEdit: false });
    div.querySelector('#next-m').onclick = () => App.go('dashboard', { month: nextMonth(App.currentMonth), resetEdit: false });
    const sa = div.querySelector('#see-all');
    if (sa) sa.onclick = () => App.go('history');
  }, 0);

  return div;
}

// TX ITEM

function makeTxItem(tx, onClick) {
  const isIncome = tx.txType === 'income';
  const cat = isIncome
    ? (INCOME_CATEGORIES[tx.incomeCategory] || INCOME_CATEGORIES.other)
    : (CATEGORIES[tx.category] || CATEGORIES.other);

  const gp = tx.groupPay;
  const totalCollected = gp ? (tx.splitCollections || []).reduce((s, c) => s + c.amount, 0) : 0;
  const outstanding = gp ? Math.max(0, tx.amount - (tx.splitShare || 0) - totalCollected) : 0;
  const fullySettled = gp && outstanding === 0;
  const netAmt = gp ? tx.amount - totalCollected : tx.amount;

  const div = document.createElement('div');
  div.style.cssText = 'border-bottom:1px solid var(--border);padding:10px 0';
  div.innerHTML = `
    <div class="tx-item" style="border-bottom:none;padding:0">
      <div class="tx-emoji" style="background:${cat.color}20">${cat.emoji}</div>
      <div class="tx-info">
        <div class="tx-name">${tx.description || cat.name}</div>
        <div class="tx-meta">
          ${fmtDate(tx.date)} · ${cat.name}
          ${isIncome ? ' · <span class="badge" style="background:#22C55E20;color:#15803D">Income</span>' : ''}
          ${gp ? `· <span class="badge" style="background:#6366F115;color:#4338CA">👥 Group Pay</span>` : ''}
          ${tx.reconciled ? ' · <span class="badge" style="background:#22C55E20;color:#15803D">✓</span>' : ''}
          ${tx.source === 'smbc_import' && !tx.reconciled ? ' · <span class="badge badge-import">Imported</span>' : ''}
          ${tx.reimbursable && !tx.reimbursedAt ? ' · <span class="badge" style="background:#7C3AED20;color:#7C3AED">💼 Pending</span>' : ''}
          ${tx.reimbursable && tx.reimbursedAt ? ' · <span class="badge" style="background:#22C55E20;color:#15803D">💼 Reimbursed</span>' : ''}
        </div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div class="tx-amount" style="color:${isIncome ? '#22C55E' : ''}">${isIncome ? '+' : '-'}${fmtYen(gp ? netAmt : tx.amount)}</div>
        ${gp && !fullySettled ? `<div style="font-size:10px;color:#92400E;font-weight:600">+¥${outstanding.toLocaleString()} owed</div>` : ''}
        ${gp && fullySettled ? `<div style="font-size:10px;color:#15803D;font-weight:600">✓ Settled</div>` : ''}
      </div>
    </div>
    ${gp && !fullySettled ? `
      <div style="margin-top:6px;padding-left:42px">
        <button class="gp-collect-btn" data-txid="${tx.id}" style="font-size:11px;padding:4px 12px;border-radius:8px;border:1.5px solid #15803D;background:#F0FDF4;color:#15803D;cursor:pointer">💰 Collect payment</button>
      </div>
    ` : ''}
  `;
  div.querySelector('.tx-item').onclick = onClick || (() => {
    App.editingTx = { ...tx };
    App.go('add', { resetEdit: false });
  });

  const collectBtn = div.querySelector('.gp-collect-btn');
  if (collectBtn) {
    collectBtn.onclick = (e) => {
      e.stopPropagation();
      showCollectDialog(tx.id);
    };
  }

  return div;
}

function showCollectDialog(txId) {
  const { transactions } = getState();
  const tx = transactions.find(t => t.id === txId);
  if (!tx) return;
  const totalCollected = (tx.splitCollections || []).reduce((s, c) => s + c.amount, 0);
  const outstanding = tx.amount - (tx.splitShare || 0) - totalCollected;

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:#0006;z-index:1000;display:flex;align-items:flex-end';
  const sheet = document.createElement('div');
  sheet.style.cssText = 'background:var(--surface);border-radius:20px 20px 0 0;padding:20px 16px 32px;width:100%;box-sizing:border-box;max-width:480px;margin:0 auto';
  sheet.innerHTML = `
    <div style="font-weight:700;font-size:16px;margin-bottom:4px">💰 Collect Payment</div>
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:16px">Outstanding: ¥${outstanding.toLocaleString()}</div>
    <div style="margin-bottom:10px">
      <div style="font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:4px">AMOUNT RECEIVED (¥)</div>
      <input id="col-amount" type="number" inputmode="numeric" value="${outstanding}" style="width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);font-size:16px;font-weight:700;color:var(--text)">
    </div>
    <div style="margin-bottom:16px">
      <div style="font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:6px">RECEIVED VIA</div>
      <div style="display:flex;gap:8px">
        ${['PayPay','Cash','Bank'].map((m,i) => `<button class="col-method tab-btn${i===0?' active':''}" data-method="${m}" style="flex:1;padding:8px;font-size:12px">${m==='PayPay'?'📱':m==='Cash'?'💴':'🏦'} ${m}</button>`).join('')}
      </div>
    </div>
    <div style="margin-bottom:16px">
      <div style="font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:4px">NOTE (optional)</div>
      <input id="col-note" type="text" placeholder="e.g. From Taro" style="width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);font-size:13px;color:var(--text)">
    </div>
    <button id="col-save" class="btn btn-primary">Save Collection</button>
    <button id="col-cancel" class="btn" style="margin-top:8px;color:var(--text-muted)">Cancel</button>
  `;
  overlay.appendChild(sheet);
  document.body.appendChild(overlay);

  let selectedMethod = 'PayPay';
  sheet.querySelectorAll('.col-method').forEach(btn => {
    btn.onclick = () => {
      selectedMethod = btn.dataset.method;
      sheet.querySelectorAll('.col-method').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
  });

  sheet.querySelector('#col-cancel').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

  sheet.querySelector('#col-save').onclick = () => {
    const amt = Math.round(parseFloat(sheet.querySelector('#col-amount').value) || 0);
    if (!amt || amt <= 0) { showToast('Enter an amount'); return; }
    const note = sheet.querySelector('#col-note').value.trim();
    const { transactions: txs } = getState();
    const idx = txs.findIndex(t => t.id === txId);
    if (idx < 0) return;
    const updated = { ...txs[idx] };
    updated.splitCollections = [...(updated.splitCollections || []), {
      id: uuid(), date: todayStr(), amount: amt, method: selectedMethod, note,
    }];
    txs[idx] = updated;
    setState({ transactions: txs });
    overlay.remove();
    showToast(`¥${amt.toLocaleString()} collected ✓`);
    App.go('history', { resetEdit: false });
  };
  setTimeout(() => sheet.querySelector('#col-amount').select(), 50);
}

// ════════════════════════════════════════════════════════════
// ADD / EDIT TRANSACTION
// ════════════════════════════════════════════════════════════

let _form = { date: todayStr(), amount: '', category: 'dining', description: '', paymentMethod: 'credit', txType: 'expense', incomeCategory: 'salary', incomeAccount: 'yucho', bankAccount: 'yucho', billingDay: 1, groupPay: false, splitPeople: 2, splitShare: '', splitMode: 'equal', reimbursable: false, reimbursementAmount: '' };

function renderAdd() {
  const isEdit = !!App.editingTx;
  if (isEdit) {
    _form = { ..._form, ...App.editingTx };
  } else if (!App._keepForm) {
    _form = { date: todayStr(), amount: '', category: 'dining', description: '', paymentMethod: 'credit', txType: 'expense', incomeCategory: 'salary', incomeAccount: 'yucho', bankAccount: 'yucho', billingDay: 1, groupPay: false, splitPeople: 2, splitShare: '' };
  }
  App._keepForm = false;

  const div = document.createElement('div');

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'header';
  hdr.innerHTML = `<h1>${isEdit ? 'Edit Transaction' : 'Add Transaction'}</h1>`;
  div.appendChild(hdr);

  const isSub = _form.txType === 'subscription';
  const isIncome = _form.txType === 'income';

  // Type toggle (Expense / Income / Subscription)
  if (!isEdit) {
    const toggleCard = document.createElement('div');
    toggleCard.className = 'card';
    toggleCard.style.paddingBottom = '12px';
    toggleCard.innerHTML = `
      <div style="display:flex;gap:6px">
        <button id="tab-expense" class="tab-btn${_form.txType === 'expense' ? ' active' : ''}" style="flex:1">💸 Expense</button>
        <button id="tab-income"  class="tab-btn${isIncome ? ' active' : ''}" style="flex:1">💰 Income</button>
        <button id="tab-sub"     class="tab-btn${isSub ? ' active' : ''}" style="flex:1">🔄 Sub</button>
      </div>
    `;
    div.appendChild(toggleCard);

          paymentMethod: _form.paymentMethod,

        }]});

      } else {
        const isExpense = _form.txType === 'expense';
        const gpOn = isExpense && _form.groupPay;
        const totalAmt = Math.round(amount);
        let splitShare = totalAmt;
        if (gpOn) {
          if (_form.splitMode === 'custom') splitShare = Math.round(parseFloat(_form.splitShare) || totalAmt);
          else splitShare = Math.round(totalAmt / (_form.splitPeople || 2));
        }
        const isReimb = isExpense && !!_form.reimbursable;
        const newTx = {
          id: uuid(),
          date: div.querySelector('#inp-date').value,
          amount: totalAmt,
          txType: _form.txType,
          category: _form.txType === 'income' ? 'other' : _form.category,
          incomeCategory: _form.txType === 'income' ? _form.incomeCategory : undefined,
          incomeAccount: _form.txType === 'income' ? _form.incomeAccount : undefined,
          bankAccount: _form.paymentMethod === 'bank' ? _form.bankAccount : undefined,
          description,
          paymentMethod: _form.paymentMethod,
          source: 'manual',
          reimbursable: isReimb || undefined,
          groupPay: gpOn || undefined,
          splitShare: gpOn ? splitShare : undefined,

        transactions.push(newTx);
        // If salary income with reimbursement amount, mark oldest pending reimbursables as reimbursed

          const reimbAmt = Math.round(parseFloat(_form.reimbursementAmount) || 0);

              t.reimbursedByTxId = newTx.id;
              remaining -= t.amount;
            }

        setState({ transactions });
        applyTxToAccounts(newTx, +1);
        // ── Spending alert (Feature 5) ──
        if (_form.txType === 'expense' && !isReimb) {
          const { budgets } = getState();
          const cat = newTx.category;
          const budget = budgets && budgets[cat];
          if (budget && budget > 0) {
            const ym = newTx.date.slice(0,7);
            const spent = getMonthTxs(transactions, ym)
              .filter(t => t.txType !== 'income' && !t.reimbursable && t.category === cat)
              .reduce((s,t) => s + t.amount, 0);
            const pct = Math.round((spent / budget) * 100);
            if (spent > budget) {
              showToast(`⚠️ Budget exceeded for ${(CATEGORIES[cat]||CATEGORIES.other).name}! ${fmtYen(spent)} / ${fmtYen(budget)}`);
            } else if (pct >= 80) {
              showToast(`⚠️ ${pct}% of ${(CATEGORIES[cat]||CATEGORIES.other).name} budget used (${fmtYen(spent)} / ${fmtYen(budget)})`);
            } else {
              showToast(_form.txType === 'income' ? 'Income added ✓' : 'Added ✓');
            }
          } else {
            showToast('Added ✓');
          }
        } else {
          showToast(_form.txType === 'income' ? 'Income added ✓' : 'Added ✓');
        }
        App.go('history');
      }
    };

    // Wire reimbursable toggle
    const reimbRow = div.querySelector('#reimb-toggle-row');
    if (reimbRow) {
      reimbRow.style.cursor = 'pointer';
      reimbRow.onclick = () => {
        _form.reimbursable = !_form.reimbursable;
        div.querySelector('#reimb-track').style.background = _form.reimbursable ? 'var(--primary)' : 'var(--border)';
        div.querySelector('#reimb-knob').style.left = _form.reimbursable ? '22px' : '2px';
      };
    }
    // Sync reimbursement amount input
    const reimbAmtInp = div.querySelector('#inp-reimb-amt');
    if (reimbAmtInp) reimbAmtInp.oninput = () => { _form.reimbursementAmount = reimbAmtInp.value; };
    // Show/hide reimb-inc-card when income category changes
    if (incGrid) incGrid.querySelectorAll('.category-btn').forEach(btn => {
      const orig = btn.onclick;
      btn.onclick = (e) => { orig?.call(btn, e); const c = div.querySelector('#reimb-inc-card'); if (c) c.style.display = _form.incomeCategory === 'salary' ? '' : 'none'; };
    });

    const delBtn = div.querySelector('#btn-del');
    if (delBtn) {
      delBtn.onclick = () => {
        if (!confirm('Delete this transaction?')) return;
        const { transactions } = getState();
        const txToDelete = transactions.find(t => t.id === App.editingTx.id);
        if (txToDelete) applyTxToAccounts(txToDelete, -1); // reverse balance effect
        setState({ transactions: transactions.filter(t => t.id !== App.editingTx.id) });
        showToast('Deleted');
        App.go('history');
      };
    }
  }, 0);

  return div;
}

function subscriptionExpectedDate(billingDay, ym) {
  // Returns the expected charge date for a subscription in the given billing cycle
  const [y, m] = ym.split('-').map(Number);
  if (billingDay >= 28) {
    // Day >= 28 falls in previous calendar month within this billing cycle
    const pm = m === 1 ? 12 : m - 1;
    const py = m === 1 ? y - 1 : y;
    const max = new Date(py, pm, 0).getDate();
    return `${py}-${String(pm).padStart(2,'0')}-${String(Math.min(billingDay, max)).padStart(2,'0')}`;
  }
  const max = new Date(y, m, 0).getDate();
  return `${y}-${String(m).padStart(2,'0')}-${String(Math.min(billingDay, max)).padStart(2,'0')}`;
}

function processCSV(file, previewEl) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const buf = e.target.result;
    let text;
    try { text = new TextDecoder('shift-jis').decode(new Uint8Array(buf)); }
    catch { text = new TextDecoder('utf-8').decode(new Uint8Array(buf)); }

    const parsed = parseSMBCCSV(text);
    previewEl.innerHTML = '';

    if (parsed.length === 0) {
      previewEl.innerHTML = `<div style="color:#EF4444;text-align:center;padding:16px;font-size:14px">⚠️ No transactions found.<br><span style="font-size:12px;color:var(--text-muted)">Make sure this is an Epos card statement CSV.</span></div>`;
      return;
    }
    runStatementReconcile(parsed, previewEl);
  };
  reader.readAsArrayBuffer(file);
}

// Normalize merchant description for name-similarity matching
function normalizeDesc(s) {
  if (!s) return '';
  // Full-width ASCII letters, digits, and common punctuation → half-width
  s = s.replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  // Full-width space → half-width
  s = s.replace(/　/g, ' ');
  // Strip common payment terminal prefixes (e.g. AP/, QP/, ETC/)
  s = s.replace(/^(AP|QP|ETC)\//i, '');
  return s.replace(/\s+/g, ' ').trim().toLowerCase();
}
function nameSimilarEnough(a, b) {
  const na = normalizeDesc(a), nb = normalizeDesc(b);
  if (!na || !nb) return false;
  if (na === nb) return true;
  const shorter = na.length <= nb.length ? na : nb;
  const longer  = na.length <= nb.length ? nb : na;
  // Substring match (need ≥4 chars to avoid noise)
  if (shorter.length >= 4 && longer.includes(shorter)) return true;
  // First 6 chars match
  if (na.length >= 6 && nb.length >= 6 && na.slice(0, 6) === nb.slice(0, 6)) return true;
  return false;
}

function runStatementReconcile(parsed, previewEl) {
    const { transactions } = getState();

    // Billing cycle
    const sortedDates = parsed.map(t => t.date).sort();
    const billingYm = billingMonthOf(sortedDates[sortedDates.length - 1]);
    const cycleLabel = billingCycleLabel(billingYm);

    // ── Block re-import of same billing month ──
    const existingImportedCount = transactions.filter(t =>
      (t.source === 'smbc_import' || t.source === 'epos_import') &&
      billingMonthOf(t.date) === billingYm
    ).length;
    if (existingImportedCount > 0) {
      previewEl.innerHTML = `
        <div style="text-align:center;padding:24px 16px">
          <div style="font-size:40px;margin-bottom:12px">🚫</div>
          <div style="font-weight:700;font-size:15px;margin-bottom:8px">${monthLabel(billingYm)} は取り込み済みです</div>
          <div style="font-size:13px;color:var(--text-muted);line-height:1.6">
            ${cycleLabel} の明細が既に ${existingImportedCount} 件インポートされています。<br>
            同じ月のステートメントを二重取り込みすることはできません。
          </div>
        </div>`;
      return;
    }

    // Already-imported hashes (also include normalized version to catch encoding variations)
    const existingHashes = new Set(transactions.filter(t => t.importHash).flatMap(t => {
      const h = t.importHash;
      // Also build a normalized variant: smbc_DATE_normalizedDesc_AMOUNT
      const m = h.match(/^(smbc|epos)_(\d{4}-\d{2}-\d{2})_(.+)_(\d+)$/);
      return m ? [h, `${m[1]}_${m[2]}_${normalizeDesc(m[3])}_${m[4]}`] : [h];
    }));

    // Secondary dedup: count how many times each date+amount pair already exists
    // (handles same-day same-amount transactions at different merchants correctly)
    const existingDateAmtCount = {};
    for (const t of transactions.filter(t => t.source === 'smbc_import' || t.source === 'epos_import')) {
      const k = `${t.date}_${t.amount}`;
      existingDateAmtCount[k] = (existingDateAmtCount[k] || 0) + 1;
    }
    const csvDateAmtSeen = {};

    // Unreconciled manual credit card expense entries in this billing cycle
    // (cash/PayPay/etc. are excluded — they stay as-is)
    const manualPool = transactions.filter(t =>
      t.source === 'manual' && t.txType !== 'income' && !t.reconciled &&
      t.paymentMethod === 'credit' &&
      billingMonthOf(t.date) === billingYm
    ).map(t => ({ ...t, _used: false }));

    // Broader pool for name-based matching (all unreconciled manual credit txs across all months)
    const namePool = transactions.filter(t =>
      t.source === 'manual' && t.txType !== 'income' && !t.reconciled &&
      t.paymentMethod === 'credit'
    );

    // Helper: days between two date strings
    const daysDiff = (a, b) => Math.abs((new Date(a) - new Date(b)) / 86400000);

    // Pass 1: resolve all exact matches first (date + amount)
    const pass1 = parsed.map(csvTx => {
      // Hash-based dedup (including normalized variant)
      if (existingHashes.has(csvTx.importHash)) return { csvTx, status: 'duplicate' };
      // Secondary dedup: same date+amount already imported (handles encoding variations)
      const daKey = `${csvTx.date}_${csvTx.amount}`;
      csvDateAmtSeen[daKey] = (csvDateAmtSeen[daKey] || 0) + 1;
      if (csvDateAmtSeen[daKey] <= (existingDateAmtCount[daKey] || 0)) {
        return { csvTx, status: 'duplicate' };
      }
      const exact = manualPool.find(m => !m._used && m.date === csvTx.date && m.amount === csvTx.amount);
      if (exact) { exact._used = true; return { csvTx, status: 'matched', manualTx: exact }; }
      return { csvTx, status: 'pending' };
    });

    // Pass 2: for pending rows, find close candidates from remaining unused manual entries
    // Criteria: exact amount match (within ¥10 for rounding) AND within 7 days
    const rows = pass1.map(r => {
      if (r.status !== 'pending') return r;
      const { csvTx } = r;
      const close = manualPool.filter(m => !m._used &&
        daysDiff(m.date, csvTx.date) <= 7 &&
        Math.abs(m.amount - csvTx.amount) <= 10
      );
      // Sort by date proximity, then exact amount first
      close.sort((a, b) => {
        const aDays = daysDiff(a.date, csvTx.date);
        const bDays = daysDiff(b.date, csvTx.date);
        if (aDays !== bDays) return aDays - bDays;
        return Math.abs(a.amount - csvTx.amount) - Math.abs(b.amount - csvTx.amount);
      });
      // Pass 2b: name-similar matches (same amount ±¥10, similar description, any date)
      // Exclude any already in `close` to avoid duplicates
      const closeIds = new Set(close.map(m => m.id));
      const nameMatches = namePool.filter(m =>
        !closeIds.has(m.id) &&
        Math.abs(m.amount - csvTx.amount) <= 10 &&
        nameSimilarEnough(m.description, csvTx.description)
      ).sort((a, b) => daysDiff(a.date, csvTx.date) - daysDiff(b.date, csvTx.date)).slice(0, 5);
      return { csvTx, status: 'unmatched', close, nameMatches };
    });

    const duplicates = rows.filter(r => r.status === 'duplicate');
    const autoMatched = rows.filter(r => r.status === 'matched');

    // Pass 3: check active subscriptions against remaining unmatched CSV rows
    const { subscriptions: allSubs } = getState();
    const activeCreditSubs = (allSubs || []).filter(s => s.active && s.paymentMethod === 'credit');
    const subMatchedHashes = new Set();
    const subMatches = [];

    for (const r of rows.filter(r2 => r2.status === 'unmatched')) {
      if (subMatchedHashes.has(r.csvTx.importHash)) continue;
      for (const sub of activeCreditSubs) {
        const expectedDate = subscriptionExpectedDate(sub.billingDay, billingYm);
        if (r.csvTx.amount === sub.amount && daysDiff(r.csvTx.date, expectedDate) <= 5) {
          subMatchedHashes.add(r.csvTx.importHash);
          subMatches.push({ csvTx: r.csvTx, sub, expectedDate });
          break;
        }
      }
    }

    const unmatched = rows.filter(r => r.status === 'unmatched' && !subMatchedHashes.has(r.csvTx.importHash));

    // Subscriptions that didn't auto-match → available as manual link candidates
    const matchedSubIds = new Set(subMatches.map(m => m.sub.id));
    const unmatchedSubs = activeCreditSubs.filter(s => !matchedSubIds.has(s.id));

    // Decision state for unmatched rows: { action: 'new'|'link'|'skip', manualId, category }
    const decisions = {};
    unmatched.forEach(r => {
      decisions[r.csvTx.importHash] = { action: 'new', manualId: null, category: r.csvTx.category };
    });

    const updateConfirmBtn = () => {
      const nLinked = Object.values(decisions).filter(d => d.action === 'link' || d.action === 'link-sub').length;
      const nNew    = Object.values(decisions).filter(d => d.action === 'new').length;
      const nSkip   = Object.values(decisions).filter(d => d.action === 'skip').length;
      const total   = autoMatched.length + subMatches.length + nLinked + nNew;
      confirmBtn.disabled = total === 0;
      confirmBtn.style.opacity = total === 0 ? '0.5' : '1';
      const parts = [];
      if (autoMatched.length + nLinked > 0) parts.push(`reconcile ${autoMatched.length + nLinked}`);
      if (subMatches.length > 0) parts.push(`${subMatches.length} subscriptions`);
      if (nNew > 0) parts.push(`add ${nNew} new`);
      if (nSkip > 0) parts.push(`skip ${nSkip}`);
      confirmBtn.textContent = total === 0 ? 'Nothing to import ✓' : `Confirm — ${parts.join(', ')}`;
    };

    // ── Summary stats ──
    const summary = document.createElement('div');
    summary.style.cssText = 'font-size:13px;margin-bottom:12px;padding:10px 14px;background:var(--bg);border-radius:10px';
    summary.innerHTML = `
      <div style="font-weight:600;color:var(--primary);margin-bottom:8px">📅 ${monthLabel(billingYm)} statement · ${cycleLabel}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;text-align:center">
        <div style="background:#22C55E15;border-radius:8px;padding:8px 4px">
          <div style="font-size:18px;font-weight:800;color:#15803D">${autoMatched.length}</div>
          <div style="font-size:9px;color:#15803D;font-weight:600">MATCHED</div>
        </div>
        <div style="background:#6366F115;border-radius:8px;padding:8px 4px">
          <div style="font-size:18px;font-weight:800;color:#4338CA">${subMatches.length}</div>
          <div style="font-size:9px;color:#4338CA;font-weight:600">SUBSCRIPTIONS</div>
        </div>
        <div style="background:#EAB30815;border-radius:8px;padding:8px 4px">
          <div style="font-size:18px;font-weight:800;color:#92400E">${unmatched.length}</div>
          <div style="font-size:9px;color:#92400E;font-weight:600">UNMATCHED</div>
        </div>
        <div style="background:var(--bg);border-radius:8px;padding:8px 4px">
          <div style="font-size:18px;font-weight:800;color:var(--text-muted)">${duplicates.length}</div>
          <div style="font-size:9px;color:var(--text-muted);font-weight:600">SKIPPED</div>
        </div>
      </div>
    `;
    previewEl.appendChild(summary);

    // ── Auto-matched ──
    if (autoMatched.length > 0) {
      const h = document.createElement('div');
      h.style.cssText = 'font-size:12px;font-weight:600;color:#15803D;margin:10px 0 6px';
      h.textContent = '✓ Auto-matched';
      previewEl.appendChild(h);
      const list = document.createElement('div');
      list.className = 'scroll-list';
      for (const { csvTx, manualTx } of autoMatched) {
        const cat = CATEGORIES[manualTx.category] || CATEGORIES.other;
        const row = document.createElement('div');
        row.className = 'scroll-item';
        row.style.background = '#22C55E08';
        row.innerHTML = `
          <span style="font-size:18px;flex-shrink:0">${cat.emoji}</span>
          <div style="flex:1;min-width:0">
            <div style="font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${manualTx.description || csvTx.description}</div>
            <div style="color:var(--text-muted);font-size:11px">${fmtDateFull(csvTx.date)} · ${cat.name}</div>
          </div>
          <div style="font-weight:700;color:#15803D;font-size:13px;flex-shrink:0">✓ ${fmtYen(csvTx.amount)}</div>
        `;
        list.appendChild(row);
      }
      previewEl.appendChild(list);
    }

    // ── Subscription matches ──
    if (subMatches.length > 0) {
      const h = document.createElement('div');
      h.style.cssText = 'font-size:12px;font-weight:600;color:#4338CA;margin:10px 0 6px';
      h.textContent = '🔄 Subscriptions';
      previewEl.appendChild(h);
      const list = document.createElement('div');
      list.className = 'scroll-list';
      for (const { csvTx, sub, expectedDate } of subMatches) {
        const cat = CATEGORIES[sub.category] || CATEGORIES.other;
        const daysDiff_ = Math.abs((new Date(csvTx.date) - new Date(expectedDate)) / 86400000);
        const row = document.createElement('div');
        row.className = 'scroll-item';
        row.style.background = '#6366F108';
        row.innerHTML = `
          <span style="font-size:18px;flex-shrink:0">${cat.emoji}</span>
          <div style="flex:1;min-width:0">
            <div style="font-weight:500;font-size:13px">${sub.name}</div>
            <div style="color:var(--text-muted);font-size:11px">${fmtDateFull(csvTx.date)} · ${cat.name}${daysDiff_ > 0 ? ` · <span style="color:#92400E">${daysDiff_}d off expected</span>` : ''}</div>
          </div>
          <div style="font-weight:700;color:#4338CA;font-size:13px;flex-shrink:0">🔄 ${fmtYen(csvTx.amount)}</div>
        `;
        list.appendChild(row);
      }
      previewEl.appendChild(list);
    }

    // ── Unmatched (with manual link UI) ──
    if (unmatched.length > 0) {
      const hRow = document.createElement('div');
      hRow.style.cssText = 'display:flex;align-items:center;gap:8px;margin:14px 0 6px';
      hRow.innerHTML = `
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none">
          <input type="checkbox" id="recon-select-all" checked style="width:15px;height:15px;accent-color:#4338CA;cursor:pointer">
          <span style="font-size:12px;font-weight:600;color:#92400E">⚠ Unmatched (${unmatched.length}) — select to add as new</span>
        </label>
      `;
      previewEl.appendChild(hRow);

      for (const { csvTx, close, nameMatches } of unmatched) {
        const hash = csvTx.importHash;
        const cat = CATEGORIES[csvTx.category] || CATEGORIES.other;

        const wrapper = document.createElement('div');
        wrapper.dataset.wrapperHash = hash;
        wrapper.style.marginBottom = '8px';

        // Main row
        const mainRow = document.createElement('div');
        mainRow.className = 'scroll-item';
        mainRow.id = 'mainrow-' + hash;
        mainRow.style.cssText = 'border:1px solid #EAB308;background:var(--surface)';
        mainRow.innerHTML = `
          <label style="display:flex;align-items:center;flex-shrink:0;cursor:pointer;padding-right:4px">
            <input type="checkbox" class="recon-row-cb" data-hash="${hash}" checked style="width:15px;height:15px;accent-color:#4338CA;cursor:pointer">
          </label>
          <span style="font-size:18px;flex-shrink:0">${cat.emoji}</span>
          <div style="flex:1;min-width:0">
            <div style="font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${csvTx.description}</div>
            <div style="color:var(--text-muted);font-size:11px">${fmtDateFull(csvTx.date)}</div>
          </div>
          <div style="font-weight:700;font-size:13px;flex-shrink:0;margin-right:8px">-${fmtYen(csvTx.amount)}</div>
          <button class="recon-link-btn" data-hash="${hash}" style="font-size:11px;padding:4px 10px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);color:var(--text-muted);white-space:nowrap;cursor:pointer">${(close.length > 0 || unmatchedSubs.length > 0) ? 'Link ▲' : 'Link ▾'}</button>
        `;
        wrapper.appendChild(mainRow);

        // Expandable panel
        const panel = document.createElement('div');
        panel.id = 'panel-' + hash;
        // Show panel by default if there are matching candidates
        const showByDefault = close.length > 0 || unmatchedSubs.length > 0 || (nameMatches && nameMatches.length > 0);
        panel.style.cssText = `display:${showByDefault ? 'block' : 'none'};background:#FFFBEB;border:1px solid #EAB308;border-top:none;border-radius:0 0 10px 10px;padding:10px 12px;margin-top:-4px`;

        const optStyle = 'display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);margin-bottom:5px;cursor:pointer';
        const ordSub = n => n + (['st','nd','rd'][((n%100-20)%10-1)]||['st','nd','rd'][n%10-1]||'th');

        const manualCandHtml = close.map(m => {
          const mc = CATEGORIES[m.category] || CATEGORIES.other;
          const note = m.amount !== csvTx.amount
            ? `<span style="color:#92400E;font-size:10px"> · amount differs (${fmtYen(m.amount)})</span>`
            : m.date !== csvTx.date
            ? `<span style="color:#92400E;font-size:10px"> · date differs (${fmtDate(m.date)})</span>`
            : '';
          return `<div class="recon-opt" data-hash="${hash}" data-mid="${m.id}" style="${optStyle}">
            <span style="font-size:15px">${mc.emoji}</span>
            <div style="flex:1;min-width:0">
              <div style="font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.description || mc.name}${note}</div>
              <div style="font-size:10px;color:var(--text-muted)">${fmtDateFull(m.date)}</div>
            </div>
            <span class="recon-opt-check" style="font-size:14px;color:#4F46E5;display:none">✓</span>
          </div>`;
        }).join('');

        const nameMatchHtml = (nameMatches || []).map(m => {
          const mc = CATEGORIES[m.category] || CATEGORIES.other;
          const dateDiff = Math.round(Math.abs((new Date(m.date) - new Date(csvTx.date)) / 86400000));
          const amtNote = m.amount !== csvTx.amount
            ? `<span style="color:#92400E;font-size:10px"> · ¥${fmtYen(m.amount)}</span>` : '';
          return `<div class="recon-opt" data-hash="${hash}" data-mid="${m.id}" style="${optStyle};border-color:#0EA5E9">
            <span style="font-size:15px">${mc.emoji}</span>
            <div style="flex:1;min-width:0">
              <div style="font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.description || mc.name}${amtNote}</div>
              <div style="font-size:10px;color:var(--text-muted)">${fmtDateFull(m.date)}${dateDiff > 0 ? ` · <span style="color:#0369A1">${dateDiff}d apart</span>` : ''}</div>
            </div>
            <span class="recon-opt-check" style="font-size:14px;color:#4F46E5;display:none">✓</span>
          </div>`;
        }).join('');

        const subCandHtml = unmatchedSubs.map(sub => {
          const sc = CATEGORIES[sub.category] || CATEGORIES.other;
          return `<div class="recon-opt" data-hash="${hash}" data-type="sub" data-subid="${sub.id}" style="${optStyle}">
            <span style="font-size:15px">${sc.emoji}</span>
            <div style="flex:1;min-width:0">
              <div style="font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${sub.name} <span style="color:#4338CA;font-size:10px">🔄 ${fmtYen(sub.amount)}/mo</span></div>
              <div style="font-size:10px;color:var(--text-muted)">every ${ordSub(sub.billingDay)}</div>
            </div>
            <span class="recon-opt-check" style="font-size:14px;color:#4F46E5;display:none">✓</span>
          </div>`;
        }).join('');

        const hasAnyCand = close.length > 0 || unmatchedSubs.length > 0 || (nameMatches && nameMatches.length > 0);

        panel.innerHTML = `
          ${close.length > 0 ? `<div style="font-size:11px;font-weight:600;color:#92400E;margin-bottom:6px">Manual entries that might match:</div>` : ''}
          ${manualCandHtml}
          ${nameMatches && nameMatches.length > 0 ? `<div style="font-size:11px;font-weight:600;color:#0369A1;margin:${close.length?'8px':'0'} 0 6px">🔤 Similar name, same amount:</div>` : ''}
          ${nameMatchHtml}
          ${unmatchedSubs.length > 0 ? `<div style="font-size:11px;font-weight:600;color:#4338CA;margin:${(close.length||(nameMatches&&nameMatches.length))?'8px':'0'} 0 6px">Subscriptions:</div>` : ''}
          ${subCandHtml}
          ${!hasAnyCand ? `<div style="font-size:12px;color:var(--text-muted);padding:4px 0 8px">No manual candidates found — will be added as new.</div>` : ''}
          <div style="display:flex;gap:8px;margin-top:6px">
            <button class="recon-action-link" data-hash="${hash}" style="flex:1;font-size:12px;padding:7px;border-radius:8px;border:1px solid #4338CA;background:#EEF2FF;color:#4338CA;cursor:pointer;opacity:0.4" disabled>✓ Link to selected above</button>
          </div>
        `;
        wrapper.appendChild(panel);
        previewEl.appendChild(wrapper);
      }

      // Track which manual IDs / subscription IDs are claimed across ALL panels
      const claimedBy = {};    // manualId -> csvHash
      const claimedSubBy = {}; // subId    -> csvHash

      const markUsed = (els, hash) => els.forEach(o => {
        if (o.dataset.hash === hash) return;
        o.style.opacity = '0.35';
        o.style.pointerEvents = 'none';
        if (!o.querySelector('.recon-opt-taken')) {
          const tag = document.createElement('span');
          tag.className = 'recon-opt-taken';
          tag.style.cssText = 'font-size:10px;color:#92400E;white-space:nowrap;margin-left:4px';
          tag.textContent = 'Used';
          o.appendChild(tag);
        }
      });
      const markFree = (els) => els.forEach(o => {
        o.style.opacity = '';
        o.style.pointerEvents = '';
        o.querySelector('.recon-opt-taken')?.remove();
      });

      const releaseManualId = (mid) => {
        delete claimedBy[mid];
        markFree([...previewEl.querySelectorAll(`.recon-opt[data-mid="${mid}"]`)]);
      };
      const claimManualId = (mid, hash) => {
        claimedBy[mid] = hash;
        markUsed([...previewEl.querySelectorAll(`.recon-opt[data-mid="${mid}"]`)], hash);
      };

      const releaseSubId = (sid) => {
        delete claimedSubBy[sid];
        markFree([...previewEl.querySelectorAll(`.recon-opt[data-subid="${sid}"]`)]);
      };
      const claimSubId = (sid, hash) => {
        claimedSubBy[sid] = hash;
        markUsed([...previewEl.querySelectorAll(`.recon-opt[data-subid="${sid}"]`)], hash);
      };

      // Wire up panel interactions
      setTimeout(() => {
        // Select all checkbox
        const selectAllCb = previewEl.querySelector('#recon-select-all');
        if (selectAllCb) {
          selectAllCb.onchange = () => {
            previewEl.querySelectorAll('.recon-row-cb').forEach(cb => {
              const hash = cb.dataset.hash;
              const d = decisions[hash];
              if (d?.action === 'link' || d?.action === 'link-sub') return; // don't touch linked rows
              cb.checked = selectAllCb.checked;
              decisions[hash] = { ...d, action: selectAllCb.checked ? 'new' : 'skip', manualId: null, subId: null };
              const mainRow = document.getElementById('mainrow-' + hash);
              if (mainRow) mainRow.style.opacity = selectAllCb.checked ? '1' : '0.45';
            });
            updateConfirmBtn();
          };
        }

        // Per-row checkboxes
        previewEl.querySelectorAll('.recon-row-cb').forEach(cb => {
          cb.onchange = () => {
            const hash = cb.dataset.hash;
            const d = decisions[hash];
            if (d?.action === 'link' || d?.action === 'link-sub') { cb.checked = true; return; }
            if (d?.action === 'link'     && d.manualId) releaseManualId(d.manualId);
            if (d?.action === 'link-sub' && d.subId)    releaseSubId(d.subId);
            decisions[hash] = { ...d, action: cb.checked ? 'new' : 'skip', manualId: null, subId: null };
            const mainRow = document.getElementById('mainrow-' + hash);
            if (mainRow) mainRow.style.opacity = cb.checked ? '1' : '0.45';
            // Update select-all state
            const allCbs = [...previewEl.querySelectorAll('.recon-row-cb')];
            const selectAll = previewEl.querySelector('#recon-select-all');
            if (selectAll) selectAll.checked = allCbs.every(c => c.checked);
            updateConfirmBtn();
          };
        });

        // Toggle panel
        previewEl.querySelectorAll('.recon-link-btn').forEach(btn => {
          btn.onclick = () => {
            const hash = btn.dataset.hash;
            const panel = document.getElementById('panel-' + hash);
            const open = panel.style.display !== 'none';
            panel.style.display = open ? 'none' : 'block';
            btn.textContent = open ? 'Link ▾' : 'Link ▲';
          };
        });

        // Select a candidate (manual entry or subscription)
        previewEl.querySelectorAll('.recon-opt').forEach(opt => {
          opt.onclick = () => {
            const hash = opt.dataset.hash;
            const mid = opt.dataset.mid;
            const sid = opt.dataset.subid;
            const isSubOpt = opt.dataset.type === 'sub';

            // Blocked if claimed by a different row
            if (isSubOpt && claimedSubBy[sid] && claimedSubBy[sid] !== hash) {
              showToast('Already linked to another transaction'); return;
            }
            if (!isSubOpt && claimedBy[mid] && claimedBy[mid] !== hash) {
              showToast('Already linked to another transaction'); return;
            }

            // Release whatever this row previously claimed
            const prev = decisions[hash];
            if (prev?.action === 'link'     && prev.manualId) releaseManualId(prev.manualId);
            if (prev?.action === 'link-sub' && prev.subId)    releaseSubId(prev.subId);

            // Deselect all opts in this panel
            document.getElementById('panel-' + hash).querySelectorAll('.recon-opt').forEach(o => {
              o.style.border = '1px solid var(--border)';
              o.style.background = 'var(--surface)';
              o.querySelector('.recon-opt-check').style.display = 'none';
            });

            // Select this opt
            opt.style.border = '1px solid #4F46E5';
            opt.style.background = '#EEF2FF';
            opt.querySelector('.recon-opt-check').style.display = '';

            if (isSubOpt) {
              claimSubId(sid, hash);
              decisions[hash] = { ...decisions[hash], action: 'link-sub', subId: sid, manualId: null };
            } else {
              claimManualId(mid, hash);
              decisions[hash] = { ...decisions[hash], action: 'link', manualId: mid, subId: null };
            }

            const linkBtn = document.getElementById('panel-' + hash).querySelector('.recon-action-link');
            linkBtn.disabled = false;
            linkBtn.style.opacity = '1';
            updateConfirmBtn();
          };
        });

        // Link selected
        previewEl.querySelectorAll('.recon-action-link').forEach(btn => {
          btn.onclick = () => {
            if (btn.disabled) return;
            const hash = btn.dataset.hash;
            // Ensure row checkbox is checked when linked
            const cb = previewEl.querySelector(`.recon-row-cb[data-hash="${hash}"]`);
            if (cb) { cb.checked = true; document.getElementById('mainrow-' + hash).style.opacity = '1'; }
            finishRow(hash, 'link', '#EAF3DE', '#15803D', '✓ Linked');
          };
        });
      }, 0);
    }

    function finishRow(hash, action, bg, color, label) {
      const panel = document.getElementById('panel-' + hash);
      if (panel) panel.style.display = 'none';
      const linkBtn = previewEl.querySelector(`.recon-link-btn[data-hash="${hash}"]`);
      if (linkBtn) {
        linkBtn.textContent = label;
        linkBtn.style.cssText = `font-size:11px;padding:4px 10px;border-radius:8px;border:1.5px solid ${color};background:${bg};color:${color};white-space:nowrap;pointer-events:none`;
      }
      updateConfirmBtn();
    }

    // ── Confirm button ──
    const confirmBtn = document.createElement('button');
    confirmBtn.className = 'btn btn-primary';
    confirmBtn.style.marginTop = '14px';
    previewEl.appendChild(confirmBtn);
    updateConfirmBtn();

    confirmBtn.onclick = () => {
      const { transactions } = getState();
      const toDeleteIds = new Set();
      const toAdd = [];

      // Subscription matches: create transaction linked to subscription
      for (const { csvTx, sub } of subMatches) {
        toAdd.push({
          id: uuid(),
          date: csvTx.date,
          amount: csvTx.amount,
          category: sub.category,
          description: sub.name,
          paymentMethod: 'credit',
          source: 'smbc_import',
          importHash: csvTx.importHash,
          subscriptionId: sub.id,
          reconciled: true,
        });
      }

      // Auto-matched: delete manual entry, add CSV tx (keep manual's category & description)
      for (const { csvTx, manualTx } of autoMatched) {
        toDeleteIds.add(manualTx.id);
        toAdd.push({
          id: uuid(),
          date: csvTx.date,
          amount: csvTx.amount,
          category: manualTx.category,
          description: manualTx.description || csvTx.description,
          paymentMethod: 'credit',
          source: 'smbc_import',
          importHash: csvTx.importHash,
          reconciled: true,
        });
      }

      // Decisions for unmatched rows
      for (const { csvTx } of unmatched) {
        const hash = csvTx.importHash;
        const dec = decisions[hash];
        if (!dec || dec.action === 'skip') continue;

        if (dec.action === 'link' && dec.manualId) {
          // Delete manual entry, add CSV tx (keep manual's category & description)
          const manualTx = transactions.find(t => t.id === dec.manualId);
          toDeleteIds.add(dec.manualId);
          toAdd.push({
            id: uuid(),
            date: csvTx.date,
            amount: csvTx.amount,
            category: manualTx?.category || dec.category || csvTx.category,
            description: manualTx?.description || csvTx.description,
            paymentMethod: 'credit',
            source: 'smbc_import',
            importHash: hash,
            reconciled: true,
          });
        } else if (dec.action === 'link-sub' && dec.subId) {
          // Link to subscription — no manual entry to delete
          const sub = allSubs.find(s => s.id === dec.subId);
          toAdd.push({
            id: uuid(),
            date: csvTx.date,
            amount: csvTx.amount,
            category: sub?.category || csvTx.category,
            description: sub?.name || csvTx.description,
            paymentMethod: 'credit',
            source: 'smbc_import',
            importHash: hash,
            subscriptionId: dec.subId,
            reconciled: true,
          });
        } else if (dec.action === 'new') {
          // Add CSV tx as-is (no manual entry to delete)
          toAdd.push({
            id: uuid(),
            date: csvTx.date,
            amount: csvTx.amount,
            category: dec.category || csvTx.category,
            description: csvTx.description,
            paymentMethod: 'credit',
            source: 'smbc_import',
            importHash: hash,
            reconciled: true,
          });
        }
      }

      const updated = transactions.filter(t => !toDeleteIds.has(t.id));
      setState({ transactions: [...updated, ...toAdd] });
      reconcileCreditSettlement(billingYm);

      const nReplaced = autoMatched.length + Object.values(decisions).filter(d => d.action === 'link' || d.action === 'link-sub').length;
      const nNewAdded = Object.values(decisions).filter(d => d.action === 'new').length + subMatches.length;

      // ── Post-import: show unreconciled manual entries ──
      previewEl.innerHTML = '';

      const resultHdr = document.createElement('div');
      resultHdr.style.cssText = 'padding:10px 14px 12px;background:var(--bg);border-radius:10px;margin-bottom:12px';
      resultHdr.innerHTML = `
        <div style="font-weight:700;color:#15803D;font-size:14px;margin-bottom:6px">✓ Import complete</div>

          ${nReplaced > 0 ? `<span style="color:#15803D">● ${nReplaced} reconciled</span><br>` : ''}
          ${nNewAdded > 0 ? `<span style="color:#4338CA">● ${nNewAdded} added</span><br>` : ''}
        </div>

      previewEl.appendChild(resultHdr);

      // Manual credit card entries in this billing cycle that are still unreconciled
      const { transactions: newTxs } = getState();
      const stillUnreconciled = newTxs.filter(t =>
        t.source === 'manual' && t.txType !== 'income' &&

        const selectedCsvForTx = {}; // txId → skippedCsv row

            <button class="res-fix-btn" data-txid="${tx.id}" style="font-size:11px;padding:4px 10px;border-radius:8px;border:1.5px solid #EAB308;background:var(--bg);color:#92400E;white-space:nowrap;cursor:pointer">Fix ▾</button>

          wrapper.appendChild(mainRow);

          const panel = document.createElement('div');
          panel.id = 'res-panel-' + tx.id;
          panel.style.cssText = 'display:none;background:#FFFBEB;border:1px solid #EAB308;border-top:none;border-radius:0 0 10px 10px;padding:10px 12px;margin-top:-4px';

          const csvCandHtml = csvCands.map(r => `
            <div class="res-csv-opt" data-txid="${tx.id}" data-csvhash="${r.csvTx.importHash}"
