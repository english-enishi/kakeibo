        // Wire up fix panel interactions
        setTimeout(() => {
          // Toggle panels
          previewEl.querySelectorAll('.res-fix-btn').forEach(btn => {

              const open = panel.style.display !== 'none';
              panel.style.display = open ? 'none' : 'block';
              btn.textContent = open ? 'Fix ▾' : 'Fix ▲';
            };
          });

          // Select a CSV candidate
          previewEl.querySelectorAll('.res-csv-opt').forEach(opt => {
            opt.onclick = () => {

              document.getElementById('res-panel-' + txid).querySelectorAll('.res-csv-opt').forEach(o => {

                o.querySelector('.res-opt-check').style.display = 'none';

              opt.querySelector('.res-opt-check').style.display = '';
              selectedCsvForTx[txid] = {
                hash: opt.dataset.csvhash, date: opt.dataset.csvdate,

          previewEl.querySelectorAll('.res-link-selected').forEach(btn => {
            btn.onclick = () => {

          // Mark as reconciled (keep manual entry, just flag it)

            btn.onclick = () => {
              const txid = btn.dataset.txid;
              const state = getState();
              const idx = state.transactions.findIndex(t => t.id === txid);
              if (idx >= 0) {
                state.transactions[idx] = { ...state.transactions[idx], reconciled: true };

              }

        }, 0);

      } else if (skippedCsv.length === 0) {

      if (subCandidates.length > 0) {

        subSection.innerHTML = `

          <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">These merchants appeared in multiple months with similar amounts. Add as subscriptions?</div>
        `;
        for (const cand of subCandidates) {
          const row = document.createElement('div');

          row.innerHTML = `

            </div>

              setState({ subscriptions: [...(subscriptions||[]), newSub] });
              btn.textContent = '✓ Added';
              btn.disabled = true;
              btn.style.color = '#15803D';

          });
        }, 0);
      }

      doneBtn.className = 'btn btn-primary';
      doneBtn.style.marginTop = '14px';
      doneBtn.textContent = 'Done';
      doneBtn.onclick = () => App.go('accounts');
      previewEl.appendChild(doneBtn);
    };
}

function detectSubscriptionCandidates(addedTxs, allTxs, existingSubs) {
  // Group all imported transactions by normalized merchant name across billing months
  const importedTxs = allTxs.filter(t => t.source === 'smbc_import' || t.source === 'epos_import');
  const byMerchant = {};
  for (const t of importedTxs) {
    const key = normalizeDesc(t.description);
    if (!key || key.length < 3) continue;
    if (!byMerchant[key]) byMerchant[key] = { desc: t.description, amounts: [], months: new Set() };
    byMerchant[key].amounts.push(t.amount);
    byMerchant[key].months.add(billingMonthOf(t.date));
  }
  const existingSubNames = new Set((existingSubs||[]).map(s => normalizeDesc(s.name)));
  const candidates = [];
  for (const [key, data] of Object.entries(byMerchant)) {
    if (data.months.size < 2) continue; // must appear in 2+ billing months
    if (existingSubNames.has(key)) continue; // already a subscription
    // Check amount consistency (all within 10% of median)
    const sorted = [...data.amounts].sort((a,b)=>a-b);
    const median = sorted[Math.floor(sorted.length/2)];
    const consistent = data.amounts.every(a => Math.abs(a - median) / median < 0.1);
    if (!consistent) continue;
    candidates.push({ desc: data.desc, amount: median, count: data.months.size });
  }
  return candidates.sort((a,b) => b.count - a.count).slice(0, 5);
}


function processEposPDF(file, previewEl) {
  previewEl.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:13px">📄 Parsing PDF…</div>';

  const loadPdfJs = () => new Promise((resolve, reject) => {
    if (window.pdfjsLib) { console.log('[Epos PDF] pdfjsLib already loaded'); resolve(window.pdfjsLib); return; }
    console.log('[Epos PDF] loading PDF.js from CDN…');
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => {
      console.log('[Epos PDF] PDF.js loaded, setting worker');
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      resolve(window.pdfjsLib);
    };
    s.onerror = (e) => { console.error('[Epos PDF] failed to load PDF.js:', e); reject(new Error('Could not load PDF.js from CDN. Check your internet connection.')); };
    document.head.appendChild(s);
  });

  const reader = new FileReader();
  reader.onload = async (e) => {
    console.log('[Epos PDF] file read, size:', e.target.result.byteLength);
    try {
      const pdfjsLib = await loadPdfJs();
      const pdf = await pdfjsLib.getDocument({ data: e.target.result }).promise;
      let allText = '';
      for (let p = 1; p <= pdf.numPages; p++) {
        const page = await pdf.getPage(p);
        const tc = await page.getTextContent();
        // Group text items by their Y position to reconstruct lines
        const byY = {};
        for (const item of tc.items) {
          if (!item.str.trim()) continue;
          const y = Math.round(item.transform[5]);
          if (!byY[y]) byY[y] = [];
          byY[y].push({ x: item.transform[4], str: item.str });
        }
        // Sort lines top-to-bottom, items left-to-right within each line
        const ys = Object.keys(byY).map(Number).sort((a, b) => b - a);
        for (const y of ys) {
          const line = byY[y].sort((a, b) => a.x - b.x).map(i => i.str).join(' ');
          allText += line + '\n';
        }
      }
      console.log('[Epos PDF] extracted text sample:', allText.slice(0, 600));
      const parsed = parseEposPDFText(allText);
      previewEl.innerHTML = '';
      if (parsed.length === 0) {
        previewEl.innerHTML = '<div style="color:#EF4444;text-align:center;padding:16px;font-size:14px">⚠️ No transactions found.<br><span style="font-size:12px;color:var(--text-muted)">Make sure this is an Epos card statement PDF.</span></div>';
        return;
      }
      runStatementReconcile(parsed, previewEl);
    } catch (err) {
      previewEl.innerHTML = `<div style="color:#EF4444;text-align:center;padding:16px;font-size:14px">⚠️ Failed to parse PDF.<br><span style="font-size:12px;color:var(--text-muted)">${err.message}</span></div>`;
    }
  };
  reader.readAsArrayBuffer(file);
}

function parseEposPDFText(text) {
  const results = [];
  // Normalise the text: collapse runs of spaces, strip zero-width chars
  const norm = text.replace(/[​﻿]/g, '').replace(/[ \t]{2,}/g, ' ');

  // Match each transaction line:
  //   YY MM DD  MERCHANT  利用金額  (１回|１ 回|分割|ボーナス一括)  N  今回支払金額
  // We anchor on the date at start of line and the payment amount at end.
  // Use the LAST number on the line as the payment amount charged this month.
  const lines = norm.split('\n');
  const DATE_RE = /^(\d{2})\s+(\d{2})\s+(\d{2})\s+(.+?)\s+([\d,]+)\s+(?:１\s*回|分\s*割|ボーナス\s*一括)\s*\d+\s+([\d,]+)/;
  for (const line of lines) {
    const m = DATE_RE.exec(line.trim());
    if (!m) continue;
    const [, yy, mm, dd, merchant, , payStr] = m;
    const date = `20${yy}-${mm}-${dd}`;
    const amount = parseInt(payStr.replace(/,/g, ''), 10);
    if (!amount || amount <= 0) continue;
    const desc = normalizeJP(merchant.replace(/\s+/g, ' ').trim());
    const importHash = `epos_${date}_${desc}_${amount}`;
    results.push({ date, description: desc, amount, category: autoCategory(desc), importHash });
  }
  // Dedupe by importHash
  const seen = new Set();
  return results.filter(r => { if (seen.has(r.importHash)) return false; seen.add(r.importHash); return true; });
}



function parseSMBCCSV(text) {
  const lines = text.split(/\r?\n/);
  const results = [];

  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const cols = line.split(',');
    if (cols.length < 6) continue;

    const type = cols[0].trim();
    if (type !== 'ショッピング') continue;

    const dateStr = cols[1].trim();
    const merchant = normalizeJP(cols[2]);
    const amountStr = cols[4].trim().replace(/[^\d]/g, '');
    const amount = parseInt(amountStr, 10);

    if (!amount || amount <= 0) continue;

    const dm = dateStr.match(/(\d{4})年(\d{2})月(\d{2})日/);
    if (!dm) continue;
    const date = `${dm[1]}-${dm[2]}-${dm[3]}`;

    const importHash = `smbc_${date}_${normalizeDesc(merchant)}_${amount}`;

    results.push({
      date,
      description: merchant,
      amount,
      category: autoCategory(merchant),
      importHash,
    });
  }

  return results;
}

  div.appendChild(ms);

  // ── Total budget card ──
  const initTotalPct = initTotal > 0 ? Math.min(100, Math.round((totalSpent / initTotal) * 100)) : 0;
  const initFill = initTotalPct > 90 ? '#EF4444' : initTotalPct > 70 ? '#F97316' : 'var(--primary)';

  const totalCard = document.createElement('div');
  totalCard.className = 'card';
  totalCard.innerHTML = `
    <div class="card-title">Total Monthly Budget</div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <span style="font-size:14px;color:var(--text-muted)">¥</span>
      <input id="total-budget" type="number" inputmode="decimal" value="${initTotal || ''}" placeholder="enter or auto-sum"
        style="font-size:24px;font-weight:800;flex:1;border:none;background:transparent;color:var(--text);outline:none;min-width:0">
    </div>
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
      <span style="color:var(--text-muted)">Spent ${fmtYen(totalSpent)}</span>
      <span id="total-pct-label" style="font-weight:700;color:${initFill}">${initTotal > 0 ? initTotalPct + '%' : '—'}</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="total-bar" style="width:${initTotal > 0 ? initTotalPct : 0}%;background:${initFill}"></div></div>
    <div id="alloc-hint" style="font-size:11px;color:var(--text-muted);margin-top:8px;text-align:right"></div>
  `;
  div.appendChild(totalCard);

  // ── Category budgets ──
  const catCard = document.createElement('div');
  catCard.className = 'card';
  catCard.innerHTML = `
    <div class="card-title">Category Budgets</div>
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px">
      · Change <strong>total</strong>: amounts scale with %, percentages stay<br>
      · Change <strong>%</strong>: amount recalculates from total<br>
      · Change <strong>¥ amount</strong>: total auto-sums, all %s update
    </div>`;

  for (const key of catKeys) {
    const cat   = CATEGORIES[key];
    const bud   = budgets[key] || 0;
    const spent = bycat[key] || 0;
    const spentPct = bud > 0 ? Math.min(100, Math.round((spent / bud) * 100)) : 0;
    const allocPct = initTotal > 0 && bud > 0 ? Math.round((bud / initTotal) * 100) : 0;
    const fillColor = spentPct > 90 ? '#EF4444' : spentPct > 70 ? '#F97316' : cat.color;

    const row = document.createElement('div');
    row.dataset.catRow = key;
    row.style.cssText = 'margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--border)';
    row.innerHTML = `
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
        <span style="font-size:18px">${cat.emoji}</span>
        <span style="font-size:14px;font-weight:600;color:var(--text)">${cat.name}</span>
        <span class="spent-pct-badge" style="margin-left:auto;font-size:12px;font-weight:700;color:${bud>0&&spent>0?fillColor:'var(--text-muted)'}">
          ${bud>0&&spent>0 ? spentPct+'% used' : 'No limit'}
        </span>
      </div>
      ${bud > 0 ? `
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-bottom:4px">
          <span>${fmtYen(spent)} spent</span><span>limit ${fmtYen(bud)}</span>
        </div>
        <div class="progress-bar" style="margin-bottom:10px">
          <div class="progress-fill" style="width:${spentPct}%;background:${fillColor}"></div>
        </div>
      ` : ''}
      <div style="display:flex;gap:8px;align-items:center">
        <div style="flex:1;position:relative">
          <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text-muted);pointer-events:none">¥</span>
          <input type="number" data-cat="${key}" data-role="amount"
            value="${bud||''}" inputmode="decimal" placeholder="no limit"
            style="padding-left:22px;width:100%;box-sizing:border-box">
        </div>
        <div style="flex:0 0 88px;position:relative">
          <input type="number" data-cat="${key}" data-role="pct"
            value="${allocPct||''}" inputmode="decimal" placeholder="—" min="0" max="100"
            style="padding-right:22px;width:100%;box-sizing:border-box;text-align:right">
          <span style="position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text-muted);pointer-events:none">%</span>
        </div>
      </div>`;
    catCard.appendChild(row);
  }
  div.appendChild(catCard);

  const saveWrap = document.createElement('div');
  saveWrap.style.padding = '0 14px 14px';
  saveWrap.innerHTML = `<button class="btn btn-primary" id="save-btn">Save</button>`;
  div.appendChild(saveWrap);

  setTimeout(() => {
    const totalInp      = div.querySelector('#total-budget');
    const totalBar      = div.querySelector('#total-bar');
    const totalPctLabel = div.querySelector('#total-pct-label');
    const allocHint     = div.querySelector('#alloc-hint');

    const getTotal = () => parseInt(totalInp.value, 10) || 0;

    const refreshTotalBar = () => {
      const mb = getTotal();
      const tPct = mb > 0 ? Math.min(100, Math.round((totalSpent / mb) * 100)) : 0;
      const tFill = tPct > 90 ? '#EF4444' : tPct > 70 ? '#F97316' : 'var(--primary)';
      totalBar.style.width = tPct + '%';
      totalBar.style.background = tFill;
      totalPctLabel.textContent = mb > 0 ? tPct + '%' : '—';
      totalPctLabel.style.color = tFill;
    };

    const refreshAllocHint = () => {
      const mb = getTotal();
      if (!mb) { allocHint.textContent = ''; return; }
      let allocated = 0;
      div.querySelectorAll('[data-role="amount"]').forEach(inp => { allocated += parseInt(inp.value,10)||0; });
      const unalloc = mb - allocated;
      allocHint.textContent = unalloc === 0 ? '✓ Fully allocated'
        : unalloc > 0 ? `${fmtYen(unalloc)} unallocated`
        : `${fmtYen(-unalloc)} over total`;
      allocHint.style.color = unalloc === 0 ? '#15803D' : unalloc > 0 ? 'var(--text-muted)' : '#EF4444';
    };

    // ── When TOTAL changes: keep pct, recalculate amounts ──
    totalInp.oninput = () => {
      const mb = getTotal();
      div.querySelectorAll('[data-role="pct"]').forEach(pctInp => {
        const key = pctInp.dataset.cat;
        const amtInp = div.querySelector(`[data-cat="${key}"][data-role="amount"]`);
        const pct = parseFloat(pctInp.value) || 0;
        amtInp.value = (pct > 0 && mb > 0) ? Math.round(mb * pct / 100) : '';
      });
      refreshTotalBar();
      refreshAllocHint();
    };

    // ── When PERCENT changes: recalculate amount from total ──
    div.querySelectorAll('[data-role="pct"]').forEach(pctInp => {
      const key = pctInp.dataset.cat;
      const amtInp = div.querySelector(`[data-cat="${key}"][data-role="amount"]`);
      pctInp.oninput = () => {
        const mb  = getTotal();
        const pct = parseFloat(pctInp.value) || 0;
        amtInp.value = (pct > 0 && mb > 0) ? Math.round(mb * pct / 100) : '';
        refreshAllocHint();
      };
    });

    // ── When AMOUNT changes: auto-sum total, recalculate all pct ──
    div.querySelectorAll('[data-role="amount"]').forEach(amtInp => {
      amtInp.oninput = () => {
        let sum = 0;
        div.querySelectorAll('[data-role="amount"]').forEach(inp => { sum += parseInt(inp.value,10)||0; });
        totalInp.value = sum || '';
        // Recalc all pct from new total
        div.querySelectorAll('[data-role="amount"]').forEach(inp => {
          const k = inp.dataset.cat;
          const pct = div.querySelector(`[data-cat="${k}"][data-role="pct"]`);
          const v = parseInt(inp.value,10)||0;
          pct.value = (v > 0 && sum > 0) ? Math.round((v/sum)*100) : '';
        });
        refreshTotalBar();
        refreshAllocHint();
      };
    });

    refreshAllocHint();

    div.querySelector('#save-btn').onclick = () => {
      const newBudgets = {};
      div.querySelectorAll('[data-role="amount"]').forEach(inp => {
        newBudgets[inp.dataset.cat] = parseInt(inp.value,10)||0;
      });
      setState({ budgets: newBudgets, monthlyBudget: getTotal() });
      showToast('Budget saved ✓');
      App.go('dashboard');
    };

    div.querySelector('#prev-m').onclick = () => App.go('budget', { month: prevMonth(App.currentMonth), resetEdit: false });
    div.querySelector('#next-m').onclick = () => App.go('budget', { month: nextMonth(App.currentMonth), resetEdit: false });
  }, 0);

  return div;
}

function accountRow(key, acc, onClick) {
  const row = document.createElement('div');
  row.className = 'tx-item';
  row.style.cursor = 'pointer';
  row.innerHTML = `
    <div class="tx-emoji" style="background:var(--primary-light)">${acc.icon}</div>
    <div class="tx-info">
      <div class="tx-name">${acc.name}</div>
      <div class="tx-meta">${ACCOUNT_TYPE_LABEL[acc.type] || ''}</div>
    </div>
    <div class="tx-amount">${fmtYen(acc.balance)}</div>
  `;
  row.onclick = onClick;
  return row;
}

function renderAccounts() {
  const { accounts, transfers, settlements } = getState();
  const div = document.createElement('div');

  const hdr = document.createElement('div');
  hdr.className = 'header';
  hdr.innerHTML = `<h1>Assets</h1><div class="subtitle">Balances &amp; investments</div>`;
  div.appendChild(hdr);

  const entries     = Object.entries(accounts);
  const bankEntries   = entries.filter(([, a]) => a.type === 'bank');
  const emoneyEntries = entries.filter(([, a]) => a.type === 'emoney');
  const cashEntries   = entries.filter(([, a]) => a.type === 'cash');
  const investEntries = entries.filter(([, a]) => a.type === 'investment');

  const liquid   = [...bankEntries, ...emoneyEntries, ...cashEntries].reduce((s, [, a]) => s + a.balance, 0);
  const invested = investEntries.reduce((s, [, a]) => s + a.balance, 0);
  const netWorth = liquid + invested;

  const nwCard = document.createElement('div');
  nwCard.className = 'card';
  nwCard.innerHTML = `
    <div class="card-title">Net Worth</div>
    <div class="big-amount" style="color:var(--primary)">${fmtYen(netWorth)}</div>
    <div style="display:flex;gap:20px;margin-top:12px">
      <div><div class="amount-label">Liquid</div><div style="font-size:14px;font-weight:700;margin-top:2px">${fmtYen(liquid)}</div></div>
      <div><div class="amount-label">Invested</div><div style="font-size:14px;font-weight:700;margin-top:2px">${fmtYen(invested)}</div></div>
    </div>
  `;
  div.appendChild(nwCard);

  const openEdit = (key) => { App.editingAccount = key; App.go('account-edit'); };

  const sections = [
    { label: 'Bank Accounts', list: bankEntries },
    { label: 'e-Money',       list: emoneyEntries },
    { label: 'Cash',          list: cashEntries },
    { label: 'Investments',   list: investEntries },
  ];
  for (const { label, list } of sections) {
    if (!list.length) continue;
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = `<div class="card-title">${label}</div>`;
    for (const [k, a] of list) c.appendChild(accountRow(k, a, () => openEdit(k)));
    div.appendChild(c);
  }

  // Transfer between accounts
  const trCard = document.createElement('div');
  trCard.className = 'card';
  trCard.innerHTML = `
    <div class="card-title">Transfer Between Accounts</div>
    <div class="form-group">
      <label>From</label>
      <select id="tr-from" style="width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--text)"></select>
    </div>
    <div class="form-group">
      <label>To</label>
      <select id="tr-to" style="width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--text)"></select>
    </div>
    <div class="form-group">
      <label>Amount (¥)</label>
      <input type="number" id="tr-amount" class="amount-input" placeholder="0" inputmode="decimal" min="1">
    </div>
    <button class="btn btn-primary" id="btn-transfer">Transfer</button>
  `;
  div.appendChild(trCard);

  setTimeout(() => {
    const fromSel = trCard.querySelector('#tr-from');
    const toSel   = trCard.querySelector('#tr-to');
    for (const [k, a] of entries) {
      fromSel.innerHTML += `<option value="${k}">${a.name}</option>`;
      toSel.innerHTML   += `<option value="${k}">${a.name}</option>`;
    }
    fromSel.value = accounts.yucho  ? 'yucho'  : entries[0]?.[0];
    toSel.value   = accounts.paypay ? 'paypay' : entries[1]?.[0] || entries[0]?.[0];

    trCard.querySelector('#btn-transfer').onclick = () => {
      const from   = fromSel.value, to = toSel.value;
      const amount = Math.round(parseFloat(trCard.querySelector('#tr-amount').value));
      if (!amount || amount <= 0) { showToast('Enter an amount'); return; }
      if (from === to) { showToast('Choose two different accounts'); return; }
      const state = getState();
      state.accounts[from].balance -= amount;
      state.accounts[to].balance   += amount;
      const newTransfers = [{ id: uuid(), date: todayStr(), from, to, amount }, ...(state.transfers || [])];
      setState({ accounts: state.accounts, transfers: newTransfers });
      showToast(`Transferred ${fmtYen(amount)} ✓`);
      App.go('accounts');
    };
  }, 0);

  // Recent transfers
  if (transfers && transfers.length) {
    const tc = document.createElement('div');
    tc.className = 'card';
    tc.innerHTML = `<div class="card-title">Recent Transfers</div>`;
    for (const t of transfers.slice(0, 5)) {
      const row = document.createElement('div');
      row.className = 'tx-item';
      row.innerHTML = `
        <div class="tx-emoji" style="background:var(--primary-light)">🔁</div>
        <div class="tx-info">
          <div class="tx-name">${(accounts[t.from]||{}).name||t.from} → ${(accounts[t.to]||{}).name||t.to}</div>
          <div class="tx-meta">${fmtDateFull(t.date)}</div>
        </div>
        <div class="tx-amount">${fmtYen(t.amount)}</div>
      `;
      tc.appendChild(row);
    }
    div.appendChild(tc);
  }

  // Credit card settlements
  if (settlements && settlements.length) {
    const sc = document.createElement('div');
    sc.className = 'card';
    sc.innerHTML = `<div class="card-title">Credit Card Settlements</div>`;
    for (const s of [...settlements].sort((a, b) => b.ym.localeCompare(a.ym)).slice(0, 6)) {
      const row = document.createElement('div');
      row.className = 'tx-item';
      row.innerHTML = `
        <div class="tx-emoji" style="background:var(--primary-light)">💳</div>
        <div class="tx-info">
          <div class="tx-name">${monthLabel(s.ym)} statement</div>
          <div class="tx-meta">Debited from ゆうちょ銀行 · ${fmtDateFull(s.date)}</div>
        </div>
        <div class="tx-amount">${fmtYen(s.amount)}</div>
      `;
      sc.appendChild(row);
    }
    div.appendChild(sc);
  }

  return div;
}

function renderAccountEdit() {
  const key = App.editingAccount;
  const { accounts } = getState();
  const acc = accounts[key];
  if (!acc) { App.go('accounts'); return document.createElement('div'); }

  const div = document.createElement('div');

  const hdr = document.createElement('div');
  hdr.className = 'header';
  hdr.innerHTML = `<h1>${acc.name}</h1><div class="subtitle">${ACCOUNT_TYPE_LABEL[acc.type] || ''} · Edit balance</div>`;
  div.appendChild(hdr);

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="form-group">
      <label>Current Balance (¥)</label>
      <input type="number" class="amount-input" id="inp-balance" value="${acc.balance}" inputmode="decimal">
    </div>
  `;
  div.appendChild(card);

  const btnWrap = document.createElement('div');
  btnWrap.style.padding = '4px 14px 14px';
  btnWrap.innerHTML = `
    <button class="btn btn-primary" id="btn-save-acc">Save</button>
    <button class="btn btn-secondary" id="btn-cancel-acc" style="margin-top:10px">Cancel</button>
  `;
  div.appendChild(btnWrap);

  setTimeout(() => {
    div.querySelector('#btn-save-acc').onclick = () => {
      const val = parseFloat(div.querySelector('#inp-balance').value);
      if (isNaN(val)) { showToast('Enter a valid amount'); return; }
      const state = getState();
      state.accounts[key].balance = Math.round(val);
      setState({ accounts: state.accounts });
      showToast('Balance updated ✓');
      App.go('accounts');
    };
    div.querySelector('#btn-cancel-acc').onclick = () => App.go('accounts');
  }, 0);

  return div;
}

function renderSettings() {
  const { transactions, subscriptions } = getState();
  const div = document.createElement('div');

  const hdr = document.createElement('div');
  hdr.className = 'header';
  hdr.innerHTML = `<h1>Settings</h1>`;
  div.appendChild(hdr);

  // Stats card
  const statsCard = document.createElement('div');
  statsCard.className = 'card';
  statsCard.innerHTML = `
    <div class="card-title">Overview</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div style="background:var(--bg);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:24px;font-weight:800">${transactions.length}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:2px">Total Transactions</div>
      </div>
      <div style="background:var(--bg);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:24px;font-weight:800">${fmtYen(transactions.reduce((s,t)=>s+t.amount,0))}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:2px">Total Spent</div>
      </div>
    </div>
  `;
  div.appendChild(statsCard);

  // Sync / backup card
  const syncCard = document.createElement('div');
  syncCard.className = 'card';
  syncCard.innerHTML = `
    <div class="card-title">Backup & Sync</div>
    <p style="font-size:13px;color:var(--text-muted);line-height:1.6;margin-bottom:14px">
      To share data between your phone and PC, export a JSON backup and save it to iCloud or Google Drive, then import it on the other device.
    </p>
    <button class="btn btn-secondary" id="export-btn" style="margin-bottom:10px">📤 Export Data (JSON)</button>
    <div style="display:flex;gap:8px;margin-bottom:4px">
      <div class="import-zone" id="json-zone" style="padding:14px;flex:1">
        <div style="font-size:20px;margin-bottom:4px">📥</div>
        <div style="font-size:13px;font-weight:600">Merge Import</div>
        <div style="font-size:11px;color:var(--text-muted)">Adds new transactions</div>
      </div>
      <div class="import-zone" id="json-zone-replace" style="padding:14px;flex:1;border-color:#EF4444">
        <div style="font-size:20px;margin-bottom:4px">🔄</div>
        <div style="font-size:13px;font-weight:600">Restore (Replace)</div>
        <div style="font-size:11px;color:var(--text-muted)">Overwrites all data</div>
      </div>
    </div>
    <input type="file" id="json-file" accept=".json" style="display:none">
    <input type="file" id="json-file-replace" accept=".json" style="display:none">
  `;
  div.appendChild(syncCard);

  // Subscriptions management
  const subCard = document.createElement('div');
  subCard.className = 'card';
  const monthlySubTotal = subscriptions.filter(s => s.active).reduce((n, s) => n + s.amount, 0);
  subCard.innerHTML = `
    <div class="card-title" style="display:flex;align-items:center;justify-content:space-between">
      <span>🔄 Subscriptions</span>
      ${subscriptions.length > 0 ? `<span style="font-size:12px;color:var(--text-muted)">${fmtYen(monthlySubTotal)}/mo</span>` : ''}
    </div>
    <div id="sub-list"></div>
    <button class="btn btn-secondary" id="add-sub-btn" style="margin-top:10px">＋ Add Subscription</button>
  `;
  div.appendChild(subCard);

  // CSV import shortcut
  const csvCard = document.createElement('div');
  csvCard.className = 'card';
  csvCard.innerHTML = `
    <div class="card-title">Credit Card</div>
    <button class="btn btn-secondary" id="csv-btn">📂 Import Epos Statement</button>
  `;
  div.appendChild(csvCard);

  // Danger zone
  const dangerCard = document.createElement('div');
  dangerCard.className = 'card';
  dangerCard.innerHTML = `
    <div class="card-title">Danger Zone</div>
<button class="btn btn-danger" id="clear-btn">🗑️ Delete All Data</button>
  `;
  div.appendChild(dangerCard);

  // Version note
  const note = document.createElement('div');
  note.style.cssText = 'text-align:center;padding:12px;font-size:11px;color:var(--text-muted)';
  note.textContent = 'Kakeibo v1.0 · Data stored on this device';
  div.appendChild(note);

  setTimeout(() => {
    div.querySelector('#export-btn').onclick = () => {
      const data = loadData();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `kakeibo_backup_${todayStr()}.json`;
      a.click();
    };

    div.querySelector('#json-zone').onclick = () => div.querySelector('#json-file').click();
    div.querySelector('#json-file').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (!data.transactions) throw new Error('invalid');
          if (!confirm(`Import ${data.transactions.length} transactions? This will merge with your current data.`)) return;
          const { transactions: current } = getState();
          const ids = new Set(current.map(t => t.id));
          const merged = [...current, ...data.transactions.filter(t => !ids.has(t.id))];
          setState({ ...data, transactions: merged });
          showToast('Import complete ✓');
          App.go('dashboard');
        } catch {
          showToast('Invalid file');
        }
      };
      reader.readAsText(file);
    };

    div.querySelector('#json-zone-replace').onclick = () => div.querySelector('#json-file-replace').click();
    div.querySelector('#json-file-replace').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (!data.transactions) throw new Error('invalid');
          if (!confirm(`⚠️ Restore ${data.transactions.length} transactions?\n\nThis will REPLACE all current data. This cannot be undone.`)) return;
          setState(data);
          showToast('Restore complete ✓');
          App.go('dashboard');
        } catch {
          showToast('Invalid file');
        }
      };
      reader.readAsText(file);
    };

    // Render subscription list
    const subList = div.querySelector('#sub-list');
    if (subscriptions.length === 0) {
      subList.innerHTML = `<div style="font-size:13px;color:var(--text-muted);padding:8px 0">No subscriptions yet.</div>`;
    } else {
      const ordinal = n => n + (['st','nd','rd'][((n%100-20)%10-1)]||['st','nd','rd'][n%10-1]||'th');
      subscriptions.forEach((sub, idx) => {
        const cat = CATEGORIES[sub.category] || CATEGORIES.other;
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)';
        row.innerHTML = `
          <span style="font-size:20px">${cat.emoji}</span>
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:13px">${sub.name}</div>
            <div style="font-size:11px;color:var(--text-muted)">${fmtYen(sub.amount)}/mo · every ${ordinal(sub.billingDay)}</div>
          </div>
          <label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-muted);cursor:pointer">
            <input type="checkbox" data-subidx="${idx}" class="sub-toggle" ${sub.active ? 'checked' : ''}>
            Active
          </label>
          <button data-subidx="${idx}" class="sub-del-btn" style="font-size:11px;padding:4px 8px;border-radius:8px;border:1px solid #EF4444;background:transparent;color:#EF4444;cursor:pointer">Delete</button>
        `;
        subList.appendChild(row);
      });

      subList.querySelectorAll('.sub-toggle').forEach(cb => {
        cb.onchange = () => {
          const { subscriptions: subs } = getState();
          subs[parseInt(cb.dataset.subidx)].active = cb.checked;
          setState({ subscriptions: subs });
        };
      });
      subList.querySelectorAll('.sub-del-btn').forEach(btn => {
        btn.onclick = () => {
          if (!confirm('Delete this subscription?')) return;
          const { subscriptions: subs } = getState();
          subs.splice(parseInt(btn.dataset.subidx), 1);
          setState({ subscriptions: subs });
          App.go('settings');
        };
      });
    }

    div.querySelector('#add-sub-btn').onclick = () => {
      _form = { date: todayStr(), amount: '', category: 'entertainment', description: '', paymentMethod: 'credit', txType: 'subscription', incomeCategory: 'salary', billingDay: 1 };
      App._keepForm = true;
      App.go('add');
    };

    div.querySelector('#csv-btn').onclick = () => App.go('import');

    div.querySelector('#clear-btn').onclick = () => {
      if (!confirm('Delete all data? This cannot be undone.')) return;
      localStorage.removeItem('kakeibo_v1');
      showToast('All data deleted');
      App.go('dashboard');
    };
  }, 0);

  return div;
}

// CHARTS

let _activeChart = null;
let _savingsChart = null;
let _assetsChart  = null;

function getMonthlyData(transactions, numMonths) {
  // Use billing month as anchor so the current period is always included
  const currentBillingYm = currentMonthStr();
  const [cy, cm] = currentBillingYm.split('-').map(Number);
  return Array.from({ length: numMonths }, (_, i) => {
    const offset = numMonths - 1 - i;
    const d = new Date(cy, cm - 1 - offset, 1);
    const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    const label = `${MONTHS[d.getMonth()]} '${String(d.getFullYear()).slice(2)}`;
    const txs = getMonthTxs(transactions, ym);
    const spending = txs.filter(t => t.txType !== 'income' && t.category !== 'savings' && !t.reimbursable).reduce((s, t) => s + t.amount, 0);
    const saved    = txs.filter(t => t.txType !== 'income' && t.category === 'savings' && !t.reimbursable).reduce((s, t) => s + t.amount, 0);
    const income   = txs.filter(t => t.txType === 'income').reduce((s, t) => s + t.amount, 0);
    return { ym, label, spending, saved, income, txs };
  });
}

function renderCharts() {
  if (_activeChart)  { _activeChart.destroy();  _activeChart  = null; }
  if (_savingsChart) { _savingsChart.destroy(); _savingsChart = null; }
  if (_assetsChart)  { _assetsChart.destroy();  _assetsChart  = null; }

  const { transactions, monthlyBudget } = getState();
  const div = document.createElement('div');

  const hdr = document.createElement('div');
  hdr.className = 'header';
  hdr.innerHTML = `<h1>Charts</h1><div class="subtitle">Monthly income & spending</div>`;
  div.appendChild(hdr);

  const months = getMonthlyData(transactions, 12);
  const hasData = months.some(m => m.spending > 0 || m.income > 0 || m.saved > 0);

  if (!hasData) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = `<div class="empty-icon">📊</div><p>No data yet.<br>Add transactions to see your history.</p>`;
    div.appendChild(empty);
    return div;
  }

  const chartCard = document.createElement('div');
  chartCard.className = 'card';
  chartCard.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <div class="card-title" style="margin-bottom:0">Monthly Overview</div>
    </div>
    <div style="display:flex;gap:14px;font-size:11px;color:var(--text-muted);margin-bottom:12px">
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#22C55E;margin-right:4px;vertical-align:middle"></span>Income</span>
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#4F46E5;margin-right:4px;vertical-align:middle"></span>Spending</span>
      <span><span style="display:inline-block;width:18px;height:0;border-top:2px dashed #F97316;margin-right:4px;vertical-align:middle"></span>Budget</span>
    </div>
    <canvas id="monthly-chart"></canvas>
    <div style="text-align:center;font-size:11px;color:var(--text-muted);margin-top:10px">Tap a bar to see that month's breakdown</div>
  `;
  div.appendChild(chartCard);

  // ── Savings Flux chart ──
  const savingsCard = document.createElement('div');
  savingsCard.className = 'card';
  savingsCard.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <div class="card-title" style="margin-bottom:0">Savings Flux</div>
    </div>
    <div style="display:flex;gap:14px;font-size:11px;color:var(--text-muted);margin-bottom:12px">
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#22C55E;margin-right:4px;vertical-align:middle"></span>Saved</span>
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#EF4444;margin-right:4px;vertical-align:middle"></span>Over-spent</span>
      <span><span style="display:inline-block;width:18px;height:0;border-top:2px solid #6366F1;margin-right:4px;vertical-align:middle"></span>Cumulative</span>
    </div>
    <canvas id="savings-chart"></canvas>
  `;
  div.appendChild(savingsCard);

  // ── Assets over time chart ──
  const assetsCard = document.createElement('div');
  assetsCard.className = 'card';
  assetsCard.id = 'assets-card';
  assetsCard.innerHTML = `
    <div class="card-title" style="margin-bottom:4px">Total Assets</div>
    <div id="assets-legend" style="display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--text-muted);margin-bottom:12px"></div>
    <canvas id="assets-chart"></canvas>
  `;
  div.appendChild(assetsCard);

  const detailPanel = document.createElement('div');
  detailPanel.id = 'detail-panel';
  div.appendChild(detailPanel);

  setTimeout(() => {
    const canvas = chartCard.querySelector('#monthly-chart');
    const labels = months.map(m => m.label);

    const datasets = [
      {
        label: 'Income',
        data: months.map(m => m.income),
        backgroundColor: '#22C55E90',
        hoverBackgroundColor: '#22C55E',
        borderRadius: 5,
        borderSkipped: false,
      },
      {
        label: 'Spending',
        data: months.map(m => m.spending),
        backgroundColor: months.map(m =>
          monthlyBudget > 0 && m.spending > monthlyBudget ? '#EF444490' : '#4F46E590'
        ),
        hoverBackgroundColor: months.map(m =>
          monthlyBudget > 0 && m.spending > monthlyBudget ? '#EF4444' : '#4F46E5'
        ),
        borderRadius: 5,
        borderSkipped: false,
      },
    ];

    if (monthlyBudget > 0) {
      datasets.push({
        label: 'Budget',
        data: months.map(() => monthlyBudget),
        type: 'line',
        borderColor: '#F97316',
        borderWidth: 1.5,
        borderDash: [5, 4],
        pointRadius: 0,
        fill: false,
        tension: 0,
      });
    }

    _activeChart = new Chart(canvas, {
      type: 'bar',
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        aspectRatio: 1.5,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => `  ${ctx.dataset.label}: ¥${Math.round(ctx.parsed.y).toLocaleString('en-US')}`,
            },
          },
        },
        scales: {
          y: {
            beginAtZero: true,
            ticks: {
              font: { size: 10 },
              callback: v => v >= 10000 ? '¥' + Math.round(v / 1000) + 'k' : '¥' + v,
              maxTicksLimit: 5,
            },
            grid: { color: '#F1F5F920' },
          },
          x: {
            ticks: { font: { size: 10 } },
            grid: { display: false },
          },
        },
        onClick: (_, elements) => {
          if (!elements.length) return;
          const idx = elements[0].index;
          showMonthDetail(months[idx], detailPanel);
        },
      },
    });

    const currentIdx = months.findIndex(m => m.ym === App.currentMonth);
    if (currentIdx >= 0 && months[currentIdx].txs.length > 0) {
      showMonthDetail(months[currentIdx], detailPanel);
    }

    // ── Savings Flux chart ──
    const savingsCanvas = savingsCard.querySelector('#savings-chart');
    const netValues = months.map(m => m.income > 0 ? m.income - m.spending : null);
    let cumulative = 0;
    const cumulativeValues = netValues.map(v => {
      if (v !== null) cumulative += v;
      return v !== null ? cumulative : null;
    });

    _savingsChart = new Chart(savingsCanvas, {
      type: 'bar',
      data: {
        labels,
        datasets: [
          {
            label: 'Monthly Net',
            data: netValues,
            backgroundColor: netValues.map(v => v === null ? 'transparent' : v >= 0 ? '#22C55E90' : '#EF444490'),
            hoverBackgroundColor: netValues.map(v => v === null ? 'transparent' : v >= 0 ? '#22C55E' : '#EF4444'),
            borderRadius: 5,
            borderSkipped: false,
            order: 2,
          },
          {
            label: 'Cumulative',
            data: cumulativeValues,
            type: 'line',
            borderColor: '#6366F1',
            borderWidth: 2,
            pointBackgroundColor: '#6366F1',
            pointRadius: 3,
            pointHoverRadius: 5,
            fill: false,
            tension: 0.3,
            order: 1,
            yAxisID: 'y2',
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        aspectRatio: 1.5,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => {
                const v = ctx.parsed.y;
                if (v === null) return '';
                const sign = v >= 0 ? '+' : '';
                return `  ${ctx.dataset.label}: ${sign}¥${Math.round(Math.abs(v)).toLocaleString('en-US')}`;
              },
            },
          },
        },
        scales: {
          y: {
            beginAtZero: true,
            ticks: {
              font: { size: 10 },
              callback: v => (v >= 0 ? '+' : '') + (Math.abs(v) >= 10000 ? '¥' + Math.round(v / 1000) + 'k' : '¥' + v),
              maxTicksLimit: 5,
            },
            grid: { color: '#F1F5F920' },
          },
          y2: {
            position: 'right',
            ticks: {
              font: { size: 10 },
              callback: v => Math.abs(v) >= 10000 ? '¥' + Math.round(v / 1000) + 'k' : '¥' + v,
              maxTicksLimit: 5,
            },
            grid: { display: false },
          },
          x: {
            ticks: { font: { size: 10 } },
            grid: { display: false },
          },
        },
        onClick: (_, elements) => {
          if (!elements.length) return;
          const idx = elements[0].index;
          showMonthDetail(months[idx], detailPanel);
        },
      },
    });

    // ── Assets over time chart ──
    const { accounts } = getState();
    const ACCT_META = {
      yucho:  { label: 'ゆうちょ', color: '#3B82F6' },
      smbc:   { label: 'SMBC',     color: '#F97316' },
      paypay: { label: 'PayPay',   color: '#EF4444' },
      cash:   { label: 'Cash',     color: '#22C55E' },
      sbi:    { label: 'SBI証券',  color: '#8B5CF6' },
    };

    // Reconstruct per-account balances at end of each month.
    // Strategy: current balance = initial + net of all txs → initial = current - net.
    const allTxs = [...transactions].sort((a, b) => a.date.localeCompare(b.date));
    const acctKeys = Object.keys(ACCT_META);

    const initialBal = {};
    for (const key of acctKeys) {
      const net = allTxs.reduce((s, t) => {
        if (txAccountKey(t) !== key) return s;
        return s + (t.txType === 'income' ? t.amount : -t.amount);
      }, 0);
      initialBal[key] = (accounts[key]?.balance || 0) - net;
    }

    // End-of-month balance for each account: replay txs up to ym
    const assetMonths = months.map(({ ym, label }) => {
      const [y, m] = ym.split('-').map(Number);
      // last moment of that month: compare date strings; ym+'-99' covers all days
      const cutoff = ym + '-99';
      const bals = {};
      for (const key of acctKeys) {
        let bal = initialBal[key];
        for (const t of allTxs) {
          if (t.date > cutoff) break;
          if (txAccountKey(t) !== key) continue;
          bal += t.txType === 'income' ? t.amount : -t.amount;
        }
        bals[key] = Math.max(0, bal); // floor at 0 for display
      }
      const total = acctKeys.reduce((s, k) => s + bals[k], 0);
      return { ym, label, bals, total };
    });

    // Only show if any data exists
    const hasAssetData = assetMonths.some(m => m.total > 0);
    if (!hasAssetData) {
      assetsCard.querySelector('#assets-legend').textContent = 'No account balance data yet.';
    } else {
      // Legend
      const legendEl = assetsCard.querySelector('#assets-legend');
      for (const key of acctKeys) {
        const { label, color } = ACCT_META[key];
        const hasAny = assetMonths.some(m => m.bals[key] > 0);
        if (!hasAny) continue;
        const dot = `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${color};margin-right:4px;vertical-align:middle"></span>`;
        const span = document.createElement('span');
        span.innerHTML = dot + label;
        legendEl.appendChild(span);
      }
      // Add total
      const totalSpan = document.createElement('span');
      totalSpan.innerHTML = `<span style="display:inline-block;width:18px;height:0;border-top:2.5px solid #1E293B;margin-right:4px;vertical-align:middle"></span>Total`;
      legendEl.appendChild(totalSpan);

      const assetCanvas = assetsCard.querySelector('#assets-chart');
      const assetLabels = assetMonths.map(m => m.label);

      const assetDatasets = acctKeys
        .filter(key => assetMonths.some(m => m.bals[key] > 0))
        .map(key => {
          const { label, color } = ACCT_META[key];
          return {
            label,
            data: assetMonths.map(m => m.bals[key]),
            backgroundColor: color + '55',
            borderColor: color,
            borderWidth: 1.5,
            fill: true,
            tension: 0.3,
            pointRadius: 2,
            pointHoverRadius: 5,
            stack: 'assets',
          };
        });

      // Total line (not stacked)
      assetDatasets.push({
        label: 'Total',
        data: assetMonths.map(m => m.total),
        backgroundColor: 'transparent',
        borderColor: '#1E293B',
        borderWidth: 2.5,
        fill: false,
        tension: 0.3,
        pointRadius: 3,
        pointHoverRadius: 6,
        type: 'line',
        stack: undefined,
        order: -1,
      });

      _assetsChart = new Chart(assetCanvas, {
        type: 'line',
        data: { labels: assetLabels, datasets: assetDatasets },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          aspectRatio: 1.5,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: ctx => `  ${ctx.dataset.label}: ¥${Math.round(ctx.parsed.y).toLocaleString('en-US')}`,
              },
            },
          },
          scales: {
            y: {
              stacked: true,
              beginAtZero: true,
              ticks: {
                font: { size: 10 },
                callback: v => v >= 10000 ? '¥' + Math.round(v / 1000) + 'k' : '¥' + v,
                maxTicksLimit: 5,
              },
              grid: { color: '#F1F5F920' },
            },
            x: {
              ticks: { font: { size: 10 } },
              grid: { display: false },
            },
          },
        },
      });
    }
  }, 50);

  return div;
}

function showMonthDetail(monthData, container) {
  const { ym, spending, income, txs } = monthData;
  const expenseTxs = txs.filter(t => t.txType !== 'income' && t.category !== 'savings');
  const incomeTxs  = txs.filter(t => t.txType === 'income');
  const bycat = spentByCategory(expenseTxs);
  const byIncomeCat = incomeByCategory(incomeTxs);
  const net = income - spending;

  const activeCats = Object.entries(bycat)
    .filter(([, v]) => v > 0)
    .sort(([, a], [, b]) => b - a);

  container.innerHTML = '';

  // ── Summary row ──
  const breakCard = document.createElement('div');
  breakCard.className = 'card';
  breakCard.innerHTML = `
    <div class="card-title" style="margin-bottom:12px">${monthLabel(ym)}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;text-align:center">
      <div style="background:#22C55E15;border-radius:8px;padding:8px 4px">
        <div style="font-size:10px;color:#15803D;font-weight:600;margin-bottom:2px">INCOME</div>
        <div style="font-size:14px;font-weight:800;color:#15803D">${fmtYen(income)}</div>
      </div>
      <div style="background:#4F46E515;border-radius:8px;padding:8px 4px">
        <div style="font-size:10px;color:#4F46E5;font-weight:600;margin-bottom:2px">SPENDING</div>
        <div style="font-size:14px;font-weight:800;color:#4F46E5">${fmtYen(spending)}</div>
      </div>
      <div style="background:${net >= 0 ? '#22C55E' : '#EF4444'}15;border-radius:8px;padding:8px 4px">
        <div style="font-size:10px;color:${net >= 0 ? '#15803D' : '#DC2626'};font-weight:600;margin-bottom:2px">NET</div>
        <div style="font-size:14px;font-weight:800;color:${net >= 0 ? '#15803D' : '#DC2626'}">${net >= 0 ? '+' : ''}${fmtYen(net)}</div>
      </div>
    </div>
  `;

  // Spending breakdown
  if (activeCats.length === 0) {
    breakCard.innerHTML += `<div style="font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:8px">SPENDING BREAKDOWN</div><div style="color:var(--text-muted);font-size:14px;text-align:center;padding:8px 0">No spending recorded</div>`;
  } else {
    const spendHead = document.createElement('div');
    spendHead.style.cssText = 'font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:8px';
    spendHead.textContent = 'SPENDING BREAKDOWN';
    breakCard.appendChild(spendHead);
    for (const [key, amount] of activeCats) {
      const cat = CATEGORIES[key] || CATEGORIES.other;
      const pct = spending > 0 ? Math.round((amount / spending) * 100) : 0;
      const row = document.createElement('div');
      row.style.marginBottom = '10px';
      row.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-size:16px">${cat.emoji}</span>
            <span style="font-size:13px;font-weight:500">${cat.name}</span>
            <span style="font-size:11px;color:var(--text-muted)">${pct}%</span>
          </div>
          <span style="font-size:13px;font-weight:700">${fmtYen(amount)}</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${pct}%;background:${cat.color}"></div>
        </div>
      `;
      breakCard.appendChild(row);
    }
  }

  // Income breakdown
  const activeIncome = Object.entries(byIncomeCat).filter(([, v]) => v > 0);
  if (activeIncome.length > 0) {
    const incHead = document.createElement('div');
    incHead.style.cssText = 'font-size:12px;font-weight:600;color:var(--text-muted);margin:14px 0 8px;border-top:1px solid var(--border);padding-top:12px';
    incHead.textContent = 'INCOME BREAKDOWN';
    breakCard.appendChild(incHead);
    for (const [key, amount] of activeIncome.sort(([,a],[,b]) => b - a)) {
      const ic = INCOME_CATEGORIES[key] || INCOME_CATEGORIES.other;
      const pct = income > 0 ? Math.round((amount / income) * 100) : 0;
      const row = document.createElement('div');
      row.style.marginBottom = '10px';
      row.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-size:16px">${ic.emoji}</span>
            <span style="font-size:13px;font-weight:500">${ic.name}</span>
            <span style="font-size:11px;color:var(--text-muted)">${pct}%</span>
          </div>
          <span style="font-size:13px;font-weight:700;color:#15803D">+${fmtYen(amount)}</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${pct}%;background:${ic.color}"></div>
        </div>
      `;
      breakCard.appendChild(row);
    }
  }

  container.appendChild(breakCard);

  // ── Transaction list ──
  const sorted = [...txs].sort((a, b) => b.date.localeCompare(a.date));
  if (sorted.length > 0) {
    const txCard = document.createElement('div');
    txCard.className = 'card';
    txCard.innerHTML = `<div class="card-title">${sorted.length} Transaction${sorted.length !== 1 ? 's' : ''}</div>`;

    // Group by date
    const byDate = {};
    for (const tx of sorted) {
      if (!byDate[tx.date]) byDate[tx.date] = [];
      byDate[tx.date].push(tx);
    }
    for (const [date, txs] of Object.entries(byDate)) {
      const dateRow = document.createElement('div');
      dateRow.style.cssText = 'font-size:11px;color:var(--text-muted);font-weight:600;padding:6px 0 2px;border-top:1px solid var(--bg);margin-top:4px';
      dateRow.textContent = fmtDate(date);
      txCard.appendChild(dateRow);
      for (const tx of txs) {
        txCard.appendChild(makeTxItem(tx, () => {
          App.editingTx = { ...tx };
          App.go('add', { resetEdit: false });
        }));
      }
    }
    container.appendChild(txCard);
  }

  // Smooth scroll to detail
  setTimeout(() => container.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
}

// ════════════════════════════════════════════════════════════

App.render();
</script>
</body>
